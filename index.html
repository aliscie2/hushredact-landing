<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HushRedact</title>
  <meta name="description" content="" />
  <meta property="og:title" content="" />
  <meta property="og:description" content="" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --ink:#020617; --ink2:#0f172a; --muted:#64748b; --line:#f1f5f9; --line2:#e2e8f0;
      --surface:#f8fafc; --accent:#6366f1; --accent-ink:#1e1b4b; --accent-soft:#eef2ff; --white:#fff;
      --ok:#15803d; --no:#b91c1c; --maxw:1200px; --ease:cubic-bezier(.22,1,.36,1);
      /* easing palette ported from the live HushRedact landing (featureDemo.module.css) */
      --ease-organic:cubic-bezier(.22,.61,.36,1); --ease-mech:cubic-bezier(.45,0,.55,1);
      --ease-back:cubic-bezier(.34,1.56,.64,1); --ease-overshoot:cubic-bezier(.32,1.28,.5,1);
      --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --font-head:"Geist","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    h1,h2,h3,h4,.brand,.eyebrow,.btn,.c-label,.faq-q{font-family:var(--font-head)}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{margin:0;font-family:var(--font);color:var(--ink);background:var(--white);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-size:16px}
    .container{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 24px}
    a{color:inherit}
    img{max-width:100%;height:auto;display:block}
    section{padding:64px 0}
    /* Exact Figma type tokens — Geist Medium 500 headings, Inter Regular 400 body */
    h1,h2,h3,h4{margin:0;font-weight:500}
    h1{font-size:clamp(36px,7vw,72px);line-height:1;letter-spacing:-.06em}      /* Label/Type@72 */
    h2{font-size:clamp(26px,4.5vw,48px);line-height:1.25;letter-spacing:-.06em} /* Label/Type@48 */
    h3{font-size:18px;line-height:1.55;letter-spacing:-.02em}                   /* Label/Type@18 */
    h4{font-size:16px;line-height:1.5;letter-spacing:-.02em}                    /* Label/Type@16 */
    p{margin:0}
    .lead{font-size:clamp(16px,2.2vw,18px);line-height:1.55;letter-spacing:-.02em;color:var(--muted)} /* Paragraph/Type@18 */
    /* tag component (Figma 57927:21071) */
    .eyebrow{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-head);font-size:14px;font-weight:500;letter-spacing:-0.02em;color:var(--ink);background:rgba(229,229,229,.4);backdrop-filter:blur(16.75px);border:1px solid #e5e5e5;padding:4px 8px;border-radius:100px;margin-bottom:16px;text-align:left}
    .eyebrow img{width:16px;height:16px;flex:none;display:block}
    /* features card icon box */
    .fcard-ic{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;display:grid;place-items:center;margin-bottom:16px}
    .fcard-ic svg{width:24px;height:24px;color:var(--ink)}
    .section-head{max-width:760px}
    .section-head.center{margin:0 auto;text-align:center}
    .section-head .lead{margin-top:14px}
    .mt-cta{margin-top:32px}
    /* buttons */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-size:14px;line-height:1.55;letter-spacing:-.02em;font-weight:500;text-decoration:none;padding:12px 22px;border-radius:1000px;border:1px solid transparent;cursor:pointer;min-height:44px;white-space:nowrap;transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease)}
    .btn-primary{background:var(--ink);color:#fff;border-color:var(--ink2)}
    .btn-soft{background:var(--surface);color:var(--ink);border-color:var(--line2)}
    .btn .ic{width:16px;height:16px;flex:none}
    @media(hover:hover){.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(2,6,23,.45)}}
    .cta-note{display:block;font-size:13px;color:var(--muted);margin-top:12px}
    /* header */
    header.site{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;text-decoration:none;letter-spacing:-.02em}
    .brand .mark{width:28px;height:28px;border-radius:7px;background:var(--accent-ink);color:#fff;display:grid;place-items:center;font-weight:700}
    .brand .mark-img{height:30px;width:auto;display:block}
    .brand img.logo{height:28px;width:auto}
    .nav-links{display:flex;gap:24px}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:15px;font-weight:500}
    @media(hover:hover){.nav-links a:hover{color:var(--ink)}}
    /* hero */
    .hero{text-align:center;padding-top:56px}
    .hero .subhead{max-width:760px;margin:20px auto 0}
    .hero-actions{margin-top:28px;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
    .hero-media{margin-top:48px;border:1px solid var(--line2);border-radius:16px;overflow:hidden;background:var(--surface);aspect-ratio:16/10;display:grid;place-items:center}
    .hero-media img{width:100%;height:100%;object-fit:cover}
    .ph{color:var(--muted);font-size:13px;padding:24px;text-align:center}
    /* minimal document editor — clear safe-copy redactions with a compact inspector */
    .hero-demo{margin-top:48px;border:1px solid var(--line2);border-radius:16px;background:#f5f5f3;overflow:hidden;box-shadow:0 24px 60px -34px rgba(2,6,23,.4);text-align:left}
    .he-appbar{min-height:52px;display:flex;align-items:center;gap:12px;padding:9px 12px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line2)}
    .he-traffic{display:flex;gap:5px;flex:none}
    .he-traffic i{width:8px;height:8px;border-radius:50%;background:#ff605c}
    .he-traffic i:nth-child(2){background:#ffbd44}.he-traffic i:nth-child(3){background:#00ca4e}
    .he-file{display:flex;flex-direction:column;min-width:0;line-height:1.25}
    .he-file b{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .he-file small{font-size:8px;color:var(--muted)}
    .he-device{margin-left:auto;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:100px;padding:4px 8px;background:#fff;font-size:8.5px;font-weight:600;color:#475569}
    .he-device i{width:6px;height:6px;border-radius:50%;background:#22c55e}
    .he-view{display:flex;gap:2px;padding:3px;border-radius:8px;background:#f1f1ef}
    .he-view span{padding:4px 8px;border-radius:6px;font-size:8.5px;font-weight:600;color:var(--muted)}
    .he-view .active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(2,6,23,.12)}
    .he-workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;min-height:430px}
    .he-canvas{display:flex;align-items:center;justify-content:center;padding:28px;background:#f5f5f3;border-right:1px solid var(--line2)}
    .he-page{position:relative;width:min(100%,650px);min-height:354px;padding:34px 44px 54px;background:#fff;border:1px solid #e7e7e4;border-radius:3px;box-shadow:0 12px 30px -20px rgba(2,6,23,.42);font-family:Georgia,"Times New Roman",serif;color:#334155}
    .he-page-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;font-family:var(--font);font-size:8px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
    .he-safe-label{display:inline-flex;align-items:center;gap:5px;color:#0f766e}
    .he-safe-label::before{content:"✓";display:grid;place-items:center;width:13px;height:13px;border-radius:50%;background:#e4f3ef;font-size:8px}
    .he-page-title{text-align:center;margin-bottom:22px;font-size:16px;font-weight:600;letter-spacing:.03em;color:#1e293b}
    .he-page p{font-size:12.5px;line-height:2.35;margin:0 0 11px}
    .he-redact{position:relative;display:inline-block;width:var(--w);height:1.02em;margin:0 2px;vertical-align:-.1em;border-radius:3px;background:var(--ink);box-shadow:inset 0 -1px rgba(255,255,255,.08)}
    .he-redact.selected{box-shadow:0 0 0 3px #e0e7ff,inset 0 -1px rgba(255,255,255,.08)}
    .he-redact.selected::after{content:attr(data-label);position:absolute;left:50%;top:-18px;transform:translateX(-50%);padding:2px 5px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-family:var(--font);font-size:7px;font-weight:700;letter-spacing:.05em;white-space:nowrap}
    .he-page-foot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-top:1px solid var(--line);font-family:var(--font);font-size:8.5px;color:var(--muted)}
    .he-page-foot strong{color:#0f766e;font-weight:600}
    .he-inspector{display:flex;flex-direction:column;padding:18px;background:#fff}
    .he-inspector-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    .he-inspector-title{font-size:14px;font-weight:600;color:var(--ink)}
    .he-inspector-sub{margin-top:3px;font-size:9px;line-height:1.45;color:var(--muted)}
    .he-total{flex:none;border-radius:100px;padding:3px 8px;background:#e4f3ef;color:#0f766e;font-size:9px;font-weight:700}
    .he-tabs{display:flex;gap:2px;margin:14px 0 10px;padding:3px;border-radius:8px;background:#f4f4f2}
    .he-tabs span{flex:1;text-align:center;padding:5px;border-radius:6px;font-size:8.5px;font-weight:600;color:var(--muted)}
    .he-tabs .active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(2,6,23,.1)}
    .he-list{border:1px solid var(--line);border-radius:10px;overflow:hidden}
    .he-entity{display:flex;align-items:center;gap:8px;padding:9px 10px;border-top:1px solid var(--line)}
    .he-entity:first-child{border-top:0}
    .he-entity.selected{background:#fafafa}
    .he-type{flex:none;min-width:34px;text-align:center;border:1px solid var(--line2);border-radius:5px;padding:2px 4px;background:#fafafa;color:var(--muted);font-size:7px;font-weight:700;letter-spacing:.04em}
    .he-entity-copy{min-width:0;display:flex;flex-direction:column;line-height:1.25}
    .he-entity-copy b{font-size:9px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .he-entity-copy small{font-size:7.5px;color:var(--muted)}
    .he-hidden{margin-left:auto;display:inline-flex;align-items:center;gap:4px;color:#0f766e;font-size:8px;font-weight:600}
    .he-hidden::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--ink)}
    .he-ready{margin-top:12px;padding:10px;border-radius:9px;background:#f0f9f6;border:1px solid #d8eee7}
    .he-ready b{display:block;font-size:9.5px;color:#0f766e}
    .he-ready span{display:block;margin-top:2px;font-size:8px;line-height:1.4;color:#47756b}
    .he-approve{margin-top:auto;display:flex;align-items:center;justify-content:center;border-radius:9px;padding:9px;background:var(--ink);color:#fff;font-size:10px;font-weight:600}
    @media(max-width:767px){
      .he-appbar{flex-wrap:wrap}.he-device{margin-left:auto}.he-view{order:4;width:100%}.he-view span{flex:1;text-align:center}
      .he-workspace{grid-template-columns:1fr}.he-canvas{padding:16px;border-right:0;border-bottom:1px solid var(--line2)}
      .he-page{min-height:330px;padding:30px 20px 54px}.he-page p{font-size:11.5px}.he-inspector{gap:0}
    }
    /* how it works */
    .hiw-head{display:flex;flex-direction:column;gap:12px}
    .caps{display:grid;grid-template-columns:1fr;gap:20px;margin-top:40px}
    .cap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--white);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
    @media(hover:hover){.cap:hover{transform:translateY(-4px);box-shadow:0 14px 30px -18px rgba(2,6,23,.35)}}
    .cap-illo{position:relative;background:var(--surface);border-bottom:1px solid var(--line);aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden}
    .cap-illo img{width:100%;height:100%;object-fit:cover}
    .cap-badge{position:absolute;z-index:3;top:16px;left:16px;width:48px;height:48px;display:grid;place-items:center;border:1px solid rgba(148,163,184,.28);border-radius:13px;background:rgba(255,255,255,.94);box-shadow:0 10px 24px -14px rgba(2,6,23,.42);backdrop-filter:blur(8px)}
    .cap-badge img{width:28px;height:28px;object-fit:contain}
    .cap-badge-detect{background:rgba(238,242,255,.96);border-color:rgba(99,102,241,.2)}
    .cap-badge-offline{background:rgba(255,241,242,.96);border-color:rgba(190,18,60,.16)}
    /* how-it-works: 3 distinct step animations */
    .sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px}
    .sc .lbl{font-size:10.5px;font-weight:600;background:#fff;border:1px solid var(--line2);border-radius:7px;padding:5px 10px;color:var(--muted);box-shadow:0 6px 14px -12px rgba(2,6,23,.4)}
    /* ONE story across the three cards — detect → blocked → offline. The SAME
       CLIENT FILE note appears in every card; a single 12s timeline
       (.caps.story-run, added once on scroll-into-view) plays left→right and
       holds the finished chain. Phase windows: detect 8-25% · handoff 25-33% ·
       upload-try 33-50% · blocked 50-58% · handoff 58-66% · offline redact 66-83% · hold. */
    .caps{position:relative}
    .note{position:relative;width:172px;background:#fffdf2;border:1px solid #eadfa8;border-radius:8px;padding:13px 14px 15px;box-shadow:0 14px 28px -16px rgba(2,6,23,.4);transform:rotate(-2deg)}
    .note::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 16px 16px 0;border-color:var(--surface) var(--surface) #eadfa8 transparent;border-bottom-left-radius:6px}
    .note-h{font-size:7.5px;font-weight:700;letter-spacing:.09em;color:#8a6d3b;margin-bottom:6px}
    .note p{font-size:9.3px;line-height:1.95;color:#475569;margin:0}
    .stok{border-radius:3px;padding:0 3px;white-space:nowrap}
    .story-run .sc-detect .stok{animation:stokDetect 12s var(--ease-organic) 1 both;animation-delay:calc(var(--i) * .4s)}
    @keyframes stokDetect{0%,8%{background:transparent;color:inherit}11%,100%{background:#fde68a;color:#7c2d12}}
    .story-run .sc-detect .note{animation:capLift1 12s var(--ease-organic) 1 both}
    @keyframes capLift1{0%,2%{transform:rotate(-2deg)}5%,28%{transform:rotate(-1deg) translateY(-4px)}33%,100%{transform:rotate(-2deg)}}
    /* 2 · private — the same note tries to reach the server, gets blocked */
    .sc-private{gap:0;justify-content:space-between;padding:14px}
    .sc-private .srv{display:inline-flex;align-items:center;gap:5px}
    .sc-private .srv svg{width:14px;height:14px}
    .story-run .sc-private .srv{animation:srvDeny 12s var(--ease-organic) 1 both}
    @keyframes srvDeny{0%,49%{border-color:var(--line2);color:var(--muted)}51%,57%{border-color:var(--no);color:var(--no)}62%,100%{border-color:var(--line2);color:var(--muted)}}
    .sc-private .chan{position:relative;flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
    .sc-private .fence{position:absolute;top:10px;left:12%;right:12%;border-top:2px dashed var(--line2)}
    .sc-private .fence i{position:absolute;top:-10px;left:50%;transform:translateX(-50%);display:grid;place-items:center;width:18px;height:18px;border-radius:5px;border:1.6px solid var(--ink);color:var(--ink);background:#fff}
    .sc-private .fence svg{width:9px;height:9px}
    .story-run .sc-private .fence i{animation:fenceFlash 12s var(--ease-organic) 1 both}
    @keyframes fenceFlash{0%,49%{border-color:var(--ink);color:var(--ink);box-shadow:none}51%,57%{border-color:var(--no);color:var(--no);box-shadow:0 0 0 4px rgba(185,28,28,.15)}62%,100%{border-color:var(--ink);color:var(--ink);box-shadow:none}}
    .sc-private .note{width:150px;margin-bottom:2px}
    .story-run .sc-private .note{animation:docTry 12s var(--ease-organic) 1 both}
    @keyframes docTry{0%,33%{transform:rotate(-2deg) translateY(0)}42%{transform:rotate(0) translateY(-30px)}47%{transform:rotate(-1deg) translateY(-24px)}52%{transform:rotate(0) translateY(-27px)}60%,100%{transform:rotate(-2deg) translateY(0)}}
    .story-run .sc-private .stok{animation:stokCarry 12s linear 1 both}
    @keyframes stokCarry{0%,34%{background:transparent;color:inherit}37%,100%{background:#fde68a;color:#7c2d12}}
    /* 3 · offline — connection dies, the same note redacts itself */
    .sc-offline{gap:11px}
    .sc-offline .wifi{position:relative;display:flex;align-items:flex-end;gap:3px;height:22px}
    .sc-offline .wifi i{width:5px;border-radius:2px;background:var(--accent)}
    .sc-offline .wifi i:nth-child(1){height:7px}
    .sc-offline .wifi i:nth-child(2){height:13px}
    .sc-offline .wifi i:nth-child(3){height:19px}
    .story-run .sc-offline .wifi i{animation:wifiOff 12s var(--ease-organic) 1 both}
    @keyframes wifiOff{0%,64%{background:var(--accent)}68%,100%{background:var(--line2)}}
    .sc-offline .wifi .slash{position:absolute;left:50%;top:-3px;width:2px;height:28px;background:var(--no);transform:translateX(-50%) rotate(45deg) scaleY(0);transform-origin:center}
    .story-run .sc-offline .wifi .slash{animation:slashIn 12s var(--ease-organic) 1 both}
    @keyframes slashIn{0%,64%{transform:translateX(-50%) rotate(45deg) scaleY(0)}69%,100%{transform:translateX(-50%) rotate(45deg) scaleY(1)}}
    .sc-offline .note{width:160px}
    .story-run .sc-offline .stok{animation:stokRedact 12s var(--ease-organic) 1 both;animation-delay:calc(var(--i) * .35s)}
    @keyframes stokRedact{0%,66%{background:transparent;color:inherit}69%,71%{background:#fde68a;color:#7c2d12}74%,100%{background:var(--ink);color:var(--ink)}}
    /* connectors between the cards (desktop): light once per handoff, stay lit */
    .conn{display:none}
    @media(min-width:1024px){
      .conn{display:block;position:absolute;top:118px;width:44px;border-top:2px dashed currentColor;color:var(--line2);z-index:2}
      .conn::after{content:"";position:absolute;right:-4px;top:-5px;border:4px solid transparent;border-left:6px solid currentColor}
      .conn1{left:calc((100% - 40px)/3 + 10px - 22px)}
      .conn2{left:calc(2*(100% - 40px)/3 + 30px - 22px)}
      .story-run .conn1{animation:connOn1 12s linear 1 both}
      .story-run .conn2{animation:connOn2 12s linear 1 both}
      @keyframes connOn1{0%,25%{color:var(--line2)}30%,100%{color:var(--ink)}}
      @keyframes connOn2{0%,58%{color:var(--line2)}63%,100%{color:var(--ink)}}
    }
    @media(prefers-reduced-motion:reduce){
      .sc *,.conn{animation:none!important}
      .sc-detect .stok,.sc-private .stok{background:#fde68a;color:#7c2d12}
      .sc-offline .stok{background:var(--ink);color:var(--ink)}
      .sc-offline .wifi i{background:var(--line2)}
      .sc-offline .wifi .slash{transform:translateX(-50%) rotate(45deg) scaleY(1)}
      .conn{color:var(--ink)}
    }
    .cap-body{padding:22px}
    .cap-title{margin-bottom:8px}
    .cap-title h3{margin:0}
    .cap-body p{color:var(--muted);font-size:16px;line-height:1.5;letter-spacing:-.02em}
    /* compare — floating-chip cards, ported from the live site's comparison section */
    .compare{margin-top:48px;display:flex;flex-direction:column;gap:30px;max-width:1000px;margin-left:auto;margin-right:auto}
    .compare-head{display:none}
    .compare-row{position:relative;border:1px solid var(--line2);border-radius:14px;background:var(--white);padding:26px 22px 20px}
    .c-chip{position:absolute;top:0;left:20px;transform:translateY(-50%);display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line2);border-radius:100px;padding:5px 12px;font-size:13px;font-weight:500;font-family:var(--font-head);letter-spacing:-.02em;white-space:nowrap;color:var(--ink)}
    .c-chip svg{width:14px;height:14px;flex:none}
    .c-cols{display:grid;grid-template-columns:1fr;gap:22px}
    .c-with,.c-without{min-width:0}
    .grp-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;font-family:var(--font-head);margin-bottom:12px;color:var(--ink)}
    .grp-label img{height:20px;width:auto}
    .c-without .grp-label{color:var(--muted)}
    .compare ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}

          <span class="he-device"><i></i>On-device</span>
          <span class="he-view"><span>Original</span><span class="active">Safe copy</span></span>
        </div>
        <div class="he-workspace">
          <div class="he-canvas">
            <div class="he-page">
              <div class="he-page-meta"><span class="he-safe-label">SAFE COPY</span><span>6 REDACTIONS</span></div>
              <div class="he-page-title">STOCK PURCHASE AGREEMENT</div>
              <p>1.1 The ${redact('ORGANIZATION',108,true)} shall purchase the Shares from ${redact('PERSON',88)}.</p>
              <p>1.2 Aggregate consideration is ${redact('MONEY',86)}, payable to escrow account ${redact('ID NUMBER',102)}.</p>
              <p>1.3 Closing shall take place at ${redact('ADDRESS',118)} on ${redact('DATE',76)}.</p>
              <div class="he-page-foot"><strong>✓ Protected copy ready</strong><span>Original stays on your device</span></div>
            </div>
          </div>
          <aside class="he-inspector">
            <div class="he-inspector-head"><div><div class="he-inspector-title">Redactions</div><div class="he-inspector-sub">Choose what stays hidden in the safe copy.</div></div><span class="he-total">6</span></div>
            <div class="he-tabs"><span class="active">Hidden 6</span><span>Visible 0</span></div>
            <div class="he-list">
              ${entity('ORG','Northwind Capital','Organization',true)}
              ${entity('PERSON','Dana Okonkwo','Person')}
              ${entity('MONEY','$4,200,000','Money')}
              ${entity('ADDRESS','500 Market Street','Address')}
            </div>
            <div class="he-ready"><b>Safe copy ready</b><span>Only the protected version can be shared with AI.</span></div>
            <span class="he-approve">Approve safe copy</span>
          </aside>
        </div>
      </div>`;
    }
    function ctaScene(d){
      let n=0; const tag=t=>`<span class="cw-tag" style="--d:${n++}">${t}</span>`;
      return `<div class="cw" aria-hidden="true">
        <section>
          <header><span class="cw-brand">Safe AI</span><span class="cw-online"><i></i>ONLINE</span></header>
          <div class="cw-log">
            <div class="cw-file"><span class="cw-file-ic"></span><span class="cw-file-copy"><b>Safe copy attached</b><small>5 sensitive fields protected</small></span></div>
            <div class="cw-msg u" style="--delay:.5s">Summarise the key terms</div>
            <div class="cw-msg a" style="--delay:1.7s">The purchaser acquires the Shares at the stated consideration, closing on the agreed date.</div>
            <div class="cw-msg u" style="--delay:3.4s">Draft a client-ready memo</div>
            <div class="cw-msg a" style="--delay:4.6s">Done — using only the protected copy.</div>
          </div>
          <div class="cw-composer"><span class="cw-ph">Ask about the redacted document…</span><span class="cw-send">↑</span></div>
        </section>
        <section>
          <header><span class="cw-docname">Stock purchase agreement</span><span class="cw-safe">Safe copy</span></header>
          <div class="cw-body">
            <div class="cw-note">
              <div class="cw-note-k">SAFE COPY · PROTECTED</div>
              <p>Buyer ${tag('ORGANIZATION')}</p>
              <p>Seller ${tag('PERSON')}</p>
              <p>Purchase price ${tag('MONEY')}</p>
              <p>Closing ${tag('ADDRESS')}</p>
              <p>Date ${tag('DATE')}</p>
            </div>
          </div>
          <div class="cw-foot"><span>Protected copy ready</span><span>Only redacted text goes to AI</span></div>
        </section>
      </div>`;
    }
    function featScene(){
      return `<div class="fx" aria-hidden="true"><div class="fw">
        <div class="fw-bar"><span class="fw-dots"><i></i><i></i><i></i></span><span class="fw-name">Stock_Purchase_Agreement.pdf</span><span class="fw-pill">Offline</span></div>
        <div class="fw-doc">
          <div class="fw-note-stage">
            <div class="fw-note fw-note-original">
              <div class="fw-note-k">ORIGINAL · ON YOUR DEVICE</div>
              <p>Buyer <span class="fw-sensitive">Northwind Capital</span></p>
              <p>Seller <span class="fw-sensitive">Dana Okonkwo</span></p>
              <p>Price <span class="fw-sensitive">$4,200,000</span></p>
              <p>Closing <span class="fw-sensitive">March 14, 2026</span></p>
            </div>
            <span class="fw-note-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M7 14l5 5 5-5"/></svg>Redact locally</span>
            <div class="fw-note fw-note-safe">
              <div class="fw-note-k">SAFE COPY · READY FOR AI</div>
              <p>Buyer <span class="fw-redaction fw-redaction-lg"></span></p>
              <p>Seller <span class="fw-redaction fw-redaction-md"></span></p>
              <p>Price <span class="fw-redaction fw-redaction-sm"></span></p>
              <p>Closing <span class="fw-redaction fw-redaction-md"></span></p>
            </div>
          </div>
        </div>
        <div class="fw-foot"><span>OFFLINE · REDACTION</span><span class="fw-count">7 redacted on this device</span></div>
      </div></div>`;
    }
    function capScene(icon){
      const NOTE=`<div class="note">
          <div class="note-h">CLIENT FILE</div>
          <p>Dear <span class="stok" style="--i:0">Mr. John Smith</span>,</p>
          <p>SSN <span class="stok" style="--i:1">482-39-1850</span></p>
          <p>Wire from <span class="stok" style="--i:2">Acme Capital</span></p>
          <p>Call <span class="stok" style="--i:3">(555) 867-5309</span></p>
        </div>`;
      if(icon==='detect') return `<div class="sc sc-detect" aria-hidden="true">${NOTE}<span class="lbl">Detected on your device</span></div>`;
      if(icon==='private') return `<div class="sc sc-private" aria-hidden="true">
        <span class="lbl srv"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6.5 18a4.5 4.5 0 01-.4-9A6 6 0 0117.8 10 4 4 0 0117.5 18z"/></svg>Server</span>
        <div class="chan">
          <div class="fence"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></i></div>
          ${NOTE}
        </div>
        <span class="lbl">Your device</span></div>`;
      if(icon==='offline') return `<div class="sc sc-offline" aria-hidden="true">
        <div class="wifi"><i></i><i></i><i></i><span class="slash"></span></div>
        <span class="lbl">No internet</span>
        ${NOTE}</div>`;
      return '';
    }
    function header(d){
      const links=(d.nav?.links||[]).map(l=>`<a href="${esc(l.href)}">${esc(l.label)}</a>`).join('');
      const mark=d.brand?.logoMark?`<img class="mark-img" src="${esc(d.brand.logoMark)}" alt="" aria-hidden="true"/>`:`<span class="mark" aria-hidden="true">H</span>`;
      const logo=d.brand?.logo?`<img class="logo" src="${esc(d.brand.logo)}" alt="${esc(d.brand.logoAlt||d.brand.name)}"/>`:`${mark}<span>${esc(d.brand?.name)}</span>`;
      return `<header class="site" id="top"><div class="container nav">
        <a class="brand" href="#top" aria-label="${esc(d.brand?.logoAlt||d.brand?.name)}">${logo}</a>
        ${links?`<nav class="nav-links" aria-label="Primary">${links}</nav>`:''}
        <div>${btn(d.nav?.cta||'Download for Mac',dl(d),'btn-primary',IC_MAC)}</div>
      </div></header>`;
    }
    function hero(d){ const h=d.hero;
      return `<section class="hero"><div class="container"><div class="section-head center">
        ${tag(h.eyebrow,'hero-animate','style="--i:0"')}
        <h1 class="hero-animate" style="--i:1">${esc(h.headline)}</h1>
        <p class="lead subhead hero-animate" style="--i:2">${esc(h.subhead)}</p>
        <div class="hero-actions hero-animate" style="--i:3">${btn(h.primaryCta,dl(d),'btn-primary',IC_UPRIGHT,true)}</div>
        ${h.primaryCtaNote?`<span class="cta-note hero-animate" style="--i:4">${esc(h.primaryCtaNote)}</span>`:''}
        </div><div class="reveal" style="--i:1">${heroDemo()}</div></div></section>`;
    }
    function howItWorks(d){ const s=d.howItWorks; if(!s)return '';
      const caps=(s.cards||[]).map((c,i)=>`<div class="cap reveal" style="--i:${i}">
        <div class="cap-illo">${c.icon?`<span class="cap-badge cap-badge-${esc(c.icon)}" aria-hidden="true"><img src="assets/icon-${esc(c.icon)}.svg" alt=""/></span>`:''}${capScene(c.icon)}</div>
        <div class="cap-body"><div class="cap-title"><h3>${esc(c.title)}</h3></div><p>${esc(c.body)}</p></div></div>`).join('');
      return `<section id="${esc(s.id)}"><div class="container">
        <div class="hiw-head reveal">
          <div class="section-head">${tag(s.eyebrow)}<h2>${esc(s.heading)}</h2></div>
          <p class="lead hiw-body">${esc(s.body)}</p>
        </div><div class="caps"><span class="conn conn1" aria-hidden="true"></span><span class="conn conn2" aria-hidden="true"></span>${caps}</div></div></section>`;
    }
    const CMP_ICONS=[
      _svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
      _svg('<circle cx="12" cy="12" r="3"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3M6.8 6.8l2 2M15.2 15.2l2 2M17.2 6.8l-2 2M8.8 15.2l-2 2"/>'),
      _svg('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/>')
    ];
    function compare(d){ const c=d.compare; if(!c)return '';
      const logo=d.brand?.logoMark?`<img src="${esc(d.brand.logoMark)}" alt=""/>`:'';
      const rows=(c.rows||[]).map((r,i)=>`<div class="compare-row reveal" style="--i:${i}">
        <span class="c-chip">${CMP_ICONS[i%CMP_ICONS.length]}${esc(r.label)}</span>
        <div class="c-cols">
          <div class="c-with"><div class="grp-label">${logo}${esc(c.columnA)}</div><ul>${(r.hushredact||[]).map(x=>`<li>${IC_CHECK}<span>${esc(x)}</span></li>`).join('')}</ul></div>
          <div class="c-without"><div class="grp-label">${esc(c.columnB)}</div><ul>${(r.alternative||[]).map(x=>`<li>${IC_X}<span>${esc(x)}</span></li>`).join('')}</ul></div>
        </div>
      </div>`).join('');
      return `<section id="${esc(c.id)}"><div class="container">
        <div class="section-head center reveal">${tag(c.eyebrow)}<h2>${esc(c.heading)}</h2></div>
        <div class="compare">
          <div class="compare-head reveal" aria-hidden="true"><div class="col-a">${logo}${esc(c.columnA)}</div><div class="col-b">${esc(c.columnB)}</div></div>
          ${rows}
        </div></div></section>`;
    }
    function useCases(d){ const u=d.useCases; if(!u)return '';
      const cards=(u.cards||[]);
      const card=c=>`<div class="fcard reveal">${c.icon?`<div class="fcard-ic">${FEAT_ICONS[c.icon]||''}</div>`:''}<h3>${esc(c.heading)}</h3><p>${esc(c.body)}</p></div>`;
      const left=cards.slice(0,2).map(card).join(''); const right=cards.slice(2,4).map(card).join('');
      return `<section id="${esc(u.id)}"><div class="container">
        <div class="section-head center reveal">${tag(u.eyebrow)}<h2>${esc(u.heading)}</h2>${u.body?`<p class="lead">${esc(u.body)}</p>`:''}
        ${u.cta?`<div class="mt-cta">${btn(u.cta,u.ctaHref||'#how-it-works','btn-primary',IC_ARROW,true)}</div>`:''}</div>
        <div class="features-grid">
          <div class="fcol">${left}</div>
          <div class="fillo reveal"><div class="fillo-box">${featScene()}</div></div>
          <div class="fcol">${right}</div>
        </div></div></section>`;
    }
    function faq(d){ const f=d.faq; if(!f)return '';
      const items=(f.items||[]).map((it,i)=>`<div class="faq-item reveal" style="--i:${i}">
        <button class="faq-q" aria-expanded="false" id="q${i}" aria-controls="p${i}"><span>${esc(it.question)}</span>${IC_CHEV}</button>
        <div class="faq-panel" id="p${i}" role="region" aria-labelledby="q${i}"><div><p>${esc(it.answer)}</p></div></div></div>`).join('');
      return `<section id="${esc(f.id)}"><div class="container faq-wrap">
        <div class="section-head reveal">${tag(f.eyebrow)}<h2>${esc(f.heading)}</h2>${f.body?`<p class="lead">${esc(f.body)}</p>`:''}
        ${f.cta?`<div class="mt-cta">${btn(f.cta,f.ctaHref||'#','btn-primary',IC_ARROW,true)}</div>`:''}</div>
        <div class="faq-list">${items}</div></div></section>`;
    }
    function finalCta(d){ const f=d.finalCta; if(!f)return '';
      return `<section><div class="container"><div class="final reveal">
        <div class="final-img">${ctaScene(d)}</div>
        <div class="final-content"><h2>${esc(f.heading)}</h2>${f.body?`<p class="lead">${esc(f.body)}</p>`:''}
        <div class="mt-cta">${btn(f.cta,dl(d),'btn-primary',IC_MAC)}</div>${f.note?`<span class="cta-note">${esc(f.note)}</span>`:''}</div>
      </div></div></section>`;
    }
    function footer(d){ const f=d.footer; if(!f)return '';
      const cols=(f.columns||[]).map(col=>`<div class="foot-col"><h4>${esc(col.title)}</h4><ul>${(col.links||[]).map(l=>`<li><a href="${esc(l.href)}"${l.emphasis?' class="em"':''}>${esc(l.label)}${l.emphasis?IC_ARROW:''}</a></li>`).join('')}</ul></div>`).join('');
      return `<footer class="site"><div class="container">
        <div class="foot-grid">
          <div class="foot-brand"><a class="brand" href="#top">${d.brand?.logoMark?`<img class="mark-img" src="${esc(d.brand.logoMark)}" alt="" aria-hidden="true"/>`:`<span class="mark" aria-hidden="true">H</span>`}<span>${esc(d.brand?.name)}</span></a>
          <p class="foot-blurb">${esc(f.blurb)}</p>${f.cta?btn(f.cta,dl(d),'btn-primary',IC_MAC):''}</div>
          ${cols}
        </div>
        <div class="foot-bottom">${esc(f.copyright)}</div>
      </div></footer>`;
    }
    function wire(){
      document.querySelectorAll('.faq-q').forEach(b=>b.addEventListener('click',()=>{
        const it=b.closest('.faq-item'); const open=it.classList.toggle('open'); b.setAttribute('aria-expanded',open?'true':'false');
      }));
      const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
      const els=document.querySelectorAll('.reveal');
      if(reduce||!('IntersectionObserver'in window)){els.forEach(e=>e.classList.add('in-view'));}
      else{const io=new IntersectionObserver((en)=>{en.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in-view');io.unobserve(e.target)}})},{rootMargin:'0px 0px -8% 0px',threshold:.08});els.forEach(e=>io.observe(e));}
      const caps=document.querySelector('.caps');
      if(caps){
        if(reduce||!('IntersectionObserver'in window)){caps.classList.add('story-run');}
        else{const io2=new IntersectionObserver((en)=>{en.forEach(e=>{if(e.isIntersecting){caps.classList.add('story-run');io2.disconnect()}})},{threshold:.3});io2.observe(caps);}
      }
      requestAnimationFrame(()=>document.body.classList.add('loaded'));
    }
    function render(d){ setMeta(d.meta,d.brand);
      document.getElementById('app').innerHTML=[header(d),hero(d),howItWorks(d),compare(d),useCases(d),faq(d),finalCta(d),footer(d)].join('');
      wire();
    }
    fetch('landing.data.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(render)
      .catch(err=>{document.getElementById('app').innerHTML='<div class="error"><strong>Could not load landing.data.json.</strong><br>Serve over HTTP (e.g. <code>python3 -m http.server 8000</code> from the project root). ('+esc(err.message)+')</div>';});
  </script>
</body>
</html>
