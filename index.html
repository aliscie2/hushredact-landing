<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HushRedact</title>
  <meta name="description" content="" />
  <meta property="og:title" content="" />
  <meta property="og:description" content="" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --ink:#020617; --ink2:#0f172a; --muted:#64748b; --line:#f1f5f9; --line2:#e2e8f0;
      --surface:#f8fafc; --accent:#6366f1; --accent-ink:#1e1b4b; --accent-soft:#eef2ff; --white:#fff;
      --ok:#15803d; --no:#b91c1c; --maxw:1200px; --ease:cubic-bezier(.22,1,.36,1);
      /* easing palette ported from the live HushRedact landing (featureDemo.module.css) */
      --ease-organic:cubic-bezier(.22,.61,.36,1); --ease-mech:cubic-bezier(.45,0,.55,1);
      --ease-back:cubic-bezier(.34,1.56,.64,1); --ease-overshoot:cubic-bezier(.32,1.28,.5,1);
      --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --font-head:"Geist","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    h1,h2,h3,h4,.brand,.eyebrow,.btn,.c-label,.faq-q{font-family:var(--font-head)}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{margin:0;font-family:var(--font);color:var(--ink);background:var(--white);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-size:16px}
    .container{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 24px}
    a{color:inherit}
    img{max-width:100%;height:auto;display:block}
    section{padding:64px 0}
    /* Exact Figma type tokens — Geist Medium 500 headings, Inter Regular 400 body */
    h1,h2,h3,h4{margin:0;font-weight:500}
    h1{font-size:clamp(36px,7vw,72px);line-height:1;letter-spacing:-.06em}      /* Label/Type@72 */
    h2{font-size:clamp(26px,4.5vw,48px);line-height:1.25;letter-spacing:-.06em} /* Label/Type@48 */
    h3{font-size:18px;line-height:1.55;letter-spacing:-.02em}                   /* Label/Type@18 */
    h4{font-size:16px;line-height:1.5;letter-spacing:-.02em}                    /* Label/Type@16 */
    p{margin:0}
    .lead{font-size:clamp(16px,2.2vw,18px);line-height:1.55;letter-spacing:-.02em;color:var(--muted)} /* Paragraph/Type@18 */
    /* tag component (Figma 57927:21071) */
    .eyebrow{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-head);font-size:14px;font-weight:500;letter-spacing:-0.02em;color:var(--ink);background:rgba(229,229,229,.4);backdrop-filter:blur(16.75px);border:1px solid #e5e5e5;padding:4px 8px;border-radius:100px;margin-bottom:16px;text-align:left}
    .eyebrow img{width:16px;height:16px;flex:none;display:block}
    /* features card icon box */
    .fcard-ic{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;display:grid;place-items:center;margin-bottom:16px}
    .fcard-ic svg{width:24px;height:24px;color:var(--ink)}
    .section-head{max-width:760px}
    .section-head.center{margin:0 auto;text-align:center}
    .section-head .lead{margin-top:14px}
    .mt-cta{margin-top:32px}
    /* buttons */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-size:14px;line-height:1.55;letter-spacing:-.02em;font-weight:500;text-decoration:none;padding:12px 22px;border-radius:1000px;border:1px solid transparent;cursor:pointer;min-height:44px;white-space:nowrap;transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease)}
    .btn-primary{background:var(--ink);color:#fff;border-color:var(--ink2)}
    .btn-soft{background:var(--surface);color:var(--ink);border-color:var(--line2)}
    .btn .ic{width:16px;height:16px;flex:none}
    @media(hover:hover){.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(2,6,23,.45)}}
    .cta-note{display:block;font-size:13px;color:var(--muted);margin-top:12px}
    /* header */
    header.site{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;text-decoration:none;letter-spacing:-.02em}
    .brand .mark{width:28px;height:28px;border-radius:7px;background:var(--accent-ink);color:#fff;display:grid;place-items:center;font-weight:700}
    .brand .mark-img{height:30px;width:auto;display:block}
    .brand img.logo{height:28px;width:auto}
    .nav-links{display:flex;gap:24px}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:15px;font-weight:500}
    @media(hover:hover){.nav-links a:hover{color:var(--ink)}}
    /* hero */
    .hero{text-align:center;padding-top:56px}
    .hero .subhead{max-width:760px;margin:20px auto 0}
    .hero-actions{margin-top:28px;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
    .hero-media{margin-top:48px;border:1px solid var(--line2);border-radius:16px;overflow:hidden;background:var(--surface);aspect-ratio:16/10;display:grid;place-items:center}
    .hero-media img{width:100%;height:100%;object-fit:cover}
    .ph{color:var(--muted);font-size:13px;padding:24px;text-align:center}
    /* animated hero demo — replica of the real product review screen (doc + redactions rail) */
    .hero-demo{margin-top:48px;border:1px solid var(--line2);border-radius:16px;background:var(--white);overflow:hidden;display:grid;grid-template-columns:1.5fr 1fr;box-shadow:0 24px 60px -34px rgba(2,6,23,.4);text-align:left}
    .hd-doc{position:relative;padding:26px 30px 46px;font-family:Georgia,"Times New Roman",serif;color:#1e293b;background:linear-gradient(#f6f6f4 1px,transparent 1px) 0 10px/100% 33px}
    .hd-title{text-align:center;font-size:15px;letter-spacing:.02em;margin-bottom:14px}
    .hd-doc p{font-size:12.5px;line-height:2.1;margin:0 0 10px}
    .hd-sub{text-align:center;font-size:11.5px;margin-top:14px;letter-spacing:.02em}
    .hp{font-family:var(--font);font-size:9.5px;font-weight:700;letter-spacing:.04em;padding:2.5px 8px;border-radius:6px;display:inline-block;opacity:0;animation:hpIn 7.5s var(--ease-back) infinite;animation-delay:calc(var(--d) * .3s)}
    .hp-org{background:#d7ecea;color:#0f6a63}
    .hp-money{background:#fbeab8;color:#8a5a08}
    .hp-id{background:#e7defa;color:#6d33c9}
    .hp-addr{background:#e6f1d4;color:#54780f}
    @keyframes hpIn{0%,4%{opacity:0;transform:scale(.7)}8%{opacity:1;transform:scale(1.1)}11%,94%{opacity:1;transform:scale(1)}99%,100%{opacity:0;transform:scale(.7)}}
    .hd-chip{position:absolute;right:16px;bottom:14px;display:inline-flex;gap:7px;align-items:center;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:6px 12px;font-family:var(--font);font-size:11px;font-weight:600;color:var(--ink);box-shadow:0 6px 16px -10px rgba(2,6,23,.35);opacity:0;animation:hdIn 7.5s var(--ease-back) infinite;animation-delay:2.3s}
    .hd-rail{background:#fbfbfa;border-left:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px}
    .hd-railhead{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600;font-family:var(--font-head)}
    .hd-ic{width:14px;height:14px;flex:none}
    .hd-count{margin-left:auto;background:#dcf2e6;color:#136c44;border-radius:100px;padding:2px 10px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;animation:hdPulse 7.5s var(--ease-back) infinite}
    @keyframes hdPulse{0%,30%{transform:scale(1)}34%{transform:scale(1.14)}38%,100%{transform:scale(1)}}
    .hd-btns{display:flex;gap:8px}
    .hd-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line2);background:#fff;border-radius:9px;padding:7px 6px;font-size:11.5px;font-weight:600;color:var(--ink)}
    .hd-btn .hd-ic{width:12px;height:12px}
    .hd-dark{background:var(--ink);color:#fff;border-color:var(--ink)}
    .hd-cols{display:flex;justify-content:space-between;font-size:8.5px;letter-spacing:.06em;color:var(--muted);font-weight:600}
    .hd-group{border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
    .hd-ghead{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;font-size:12.5px;font-weight:700}
    .hd-gcount{background:#dcf2e6;color:#136c44;border-radius:100px;padding:1px 8px;font-size:10px;font-weight:600;animation:hdPulse 7.5s var(--ease-back) infinite;animation-delay:.2s}
    .hr-row{display:flex;align-items:center;gap:8px;padding:7px 11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink);opacity:0;animation:hdIn 7.5s var(--ease-back) infinite;animation-delay:calc(var(--d) * .28s + .9s)}
    @keyframes hdIn{0%,5%{opacity:0;transform:translateX(12px)}9%{opacity:1;transform:none}94%{opacity:1;transform:none}99%,100%{opacity:0}}
    .hr-tag{font-size:8px;font-weight:700;border:1px solid var(--line2);border-radius:5px;padding:1px 5px;color:var(--muted);background:#fafaf9;letter-spacing:.03em}
    .hr-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .hr-eye{width:13px;height:13px;color:var(--muted);flex:none}
    .hd-approve{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--ink);color:#fff;border-radius:10px;padding:9px;font-size:12.5px;font-weight:600}
    @media(prefers-reduced-motion:reduce){.hp,.hr-row,.hd-chip{animation:none;opacity:1}.hd-count,.hd-gcount{animation:none}}
    @media(max-width:767px){.hero-demo{grid-template-columns:1fr}.hd-rail{border-left:0;border-top:1px solid var(--line)}.hd-doc{padding:20px 18px 44px}}
    /* how it works */
    .hiw-head{display:flex;flex-direction:column;gap:12px}
    .caps{display:grid;grid-template-columns:1fr;gap:20px;margin-top:40px}
    .cap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--white);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
    @media(hover:hover){.cap:hover{transform:translateY(-4px);box-shadow:0 14px 30px -18px rgba(2,6,23,.35)}}
    .cap-illo{position:relative;background:var(--surface);border-bottom:1px solid var(--line);aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden}
    .cap-illo img{width:100%;height:100%;object-fit:cover}
    /* how-it-works: 3 distinct step animations */
    .sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px}
    .sc .lbl{font-size:9px;font-weight:600;background:#fff;border:1px solid var(--line2);border-radius:6px;padding:4px 9px;color:var(--muted)}
    /* 1 · detect — tiny sticky note whose PII items cycle highlight → blackout
       (ported from the live site's PaperAnimation letter loop) */
    .sc-detect .note{position:relative;width:172px;background:#fffdf2;border:1px solid #eadfa8;border-radius:8px;padding:13px 14px 15px;box-shadow:0 14px 28px -16px rgba(2,6,23,.4);transform:rotate(-2.5deg);animation:noteBob 8s var(--ease-organic) infinite}
    @keyframes noteBob{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(-1.3deg) translateY(-3px)}}
    .sc-detect .note::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 16px 16px 0;border-color:var(--surface) var(--surface) #eadfa8 transparent;border-bottom-left-radius:6px}
    .sc-detect .note-h{font-size:7.5px;font-weight:700;letter-spacing:.09em;color:#8a6d3b;margin-bottom:6px}
    .sc-detect .note p{font-size:9.3px;line-height:1.95;color:#475569;margin:0}
    .ntok{border-radius:3px;padding:0 3px;white-space:nowrap;animation:noteRedact 8s var(--ease-organic) infinite;animation-delay:calc(var(--d) * 1.1s)}
    @keyframes noteRedact{0%,6%{background:transparent;color:inherit}9%,14%{background:#fde68a;color:#7c2d12}18%,86%{background:var(--ink);color:var(--ink)}93%,100%{background:transparent;color:inherit}}
    /* shared tiny paper card used by the private/offline scenes */
    .mdoc{position:relative;background:#fff;border:1px solid var(--line2);border-radius:7px;box-shadow:0 12px 24px -15px rgba(2,6,23,.5)}
    .mdoc i{display:block;height:4px;border-radius:2px;background:var(--line2);margin-top:5px}
    .mdoc i:first-child{margin-top:0;width:55%;background:#cbd5e1}
    .mdoc i:nth-child(2){width:92%}
    .mdoc i:nth-child(3){width:74%}
    .mdoc i:nth-child(4){width:84%}
    /* 2 · private — your document tries to reach the server, gets blocked, stays on device */
    .sc-private{gap:0;justify-content:space-between;padding:14px}
    .sc-private .srv{display:inline-flex;align-items:center;gap:5px;animation:srvDeny 5.2s var(--ease-organic) infinite}
    .sc-private .srv svg{width:13px;height:13px}
    @keyframes srvDeny{0%,42%{border-color:var(--line2);color:var(--muted)}47%,60%{border-color:var(--no);color:var(--no)}68%,100%{border-color:var(--line2);color:var(--muted)}}
    .sc-private .chan{position:relative;flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
    .sc-private .fence{position:absolute;top:12px;left:16%;right:16%;border-top:2px dashed var(--line2)}
    .sc-private .fence i{position:absolute;top:-10px;left:50%;transform:translateX(-50%);display:grid;place-items:center;width:18px;height:18px;border-radius:5px;border:1.6px solid var(--ink);color:var(--ink);background:#fff;animation:fenceFlash 5.2s var(--ease-organic) infinite}
    .sc-private .fence svg{width:9px;height:9px}
    @keyframes fenceFlash{0%,42%{border-color:var(--ink);color:var(--ink);box-shadow:none}47%,60%{border-color:var(--no);color:var(--no);box-shadow:0 0 0 4px rgba(185,28,28,.15)}68%,100%{border-color:var(--ink);color:var(--ink);box-shadow:none}}
    .sc-private .mdoc{width:104px;padding:9px 10px;margin-bottom:2px;animation:docTry 5.2s var(--ease-organic) infinite}
    @keyframes docTry{0%,16%{transform:translateY(0) rotate(0)}40%{transform:translateY(-34px) rotate(-1.5deg)}46%{transform:translateY(-28px) rotate(1deg)}53%{transform:translateY(-31px) rotate(-.5deg)}74%,100%{transform:translateY(0) rotate(0)}}
    /* 3 · offline — no connection, the document still redacts itself */
    .sc-offline{gap:11px}
    .sc-offline .wifi{position:relative;display:flex;align-items:flex-end;gap:3px;height:22px}
    .sc-offline .wifi i{width:5px;border-radius:2px;background:var(--accent);animation:wifiOff 8s var(--ease-organic) infinite}
    .sc-offline .wifi i:nth-child(1){height:7px;animation-delay:.14s}
    .sc-offline .wifi i:nth-child(2){height:13px;animation-delay:.07s}
    .sc-offline .wifi i:nth-child(3){height:19px}
    @keyframes wifiOff{0%,3%{background:var(--accent)}8%,90%{background:var(--line2)}96%,100%{background:var(--accent)}}
    .sc-offline .wifi .slash{position:absolute;left:50%;top:-3px;width:2px;height:28px;background:var(--no);transform:translateX(-50%) rotate(45deg) scaleY(0);transform-origin:center;animation:slashIn 8s var(--ease-organic) infinite}
    @keyframes slashIn{0%,3%{transform:translateX(-50%) rotate(45deg) scaleY(0)}8%,90%{transform:translateX(-50%) rotate(45deg) scaleY(1)}96%,100%{transform:translateX(-50%) rotate(45deg) scaleY(0)}}
    .sc-offline .mdoc{width:150px;padding:10px 12px}
    .sc-offline .mdoc p{font-size:8.8px;line-height:1.95;color:#475569;margin:0}
    @media(prefers-reduced-motion:reduce){
      .sc *{animation:none!important}
      .ntok{background:var(--ink);color:var(--ink)}
      .sc-offline .wifi i{background:var(--line2)}
      .sc-offline .wifi .slash{transform:translateX(-50%) rotate(45deg) scaleY(1)}
    }
    .cap-body{padding:22px}
    .cap-title{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .cap-title h3{margin:0}
    .cap-ic{width:20px;height:20px;flex:none;color:var(--ink)}
    .cap-body p{color:var(--muted);font-size:16px;line-height:1.5;letter-spacing:-.02em}
    /* compare — floating-chip cards, ported from the live site's comparison section */
    .compare{margin-top:48px;display:flex;flex-direction:column;gap:30px;max-width:1000px;margin-left:auto;margin-right:auto}
    .compare-head{display:none}
    .compare-row{position:relative;border:1px solid var(--line2);border-radius:14px;background:var(--white);padding:26px 22px 20px}
    .c-chip{position:absolute;top:0;left:20px;transform:translateY(-50%);display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line2);border-radius:100px;padding:5px 12px;font-size:13px;font-weight:500;font-family:var(--font-head);letter-spacing:-.02em;white-space:nowrap;color:var(--ink)}
    .c-chip svg{width:14px;height:14px;flex:none}
    .c-cols{display:grid;grid-template-columns:1fr;gap:22px}
    .c-with,.c-without{min-width:0}
    .grp-label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;font-family:var(--font-head);margin-bottom:12px;color:var(--ink)}
    .grp-label img{height:20px;width:auto}
    .c-without .grp-label{color:var(--muted)}
    .compare ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
    .compare li{font-size:14.5px;display:flex;gap:10px;align-items:flex-start;line-height:1.45}
    .mk{flex:none;width:18px;height:18px;margin-top:1px}
    .mk-ok{color:var(--ok)} .mk-no{color:var(--no)}
    /* features */
    .features-grid{display:flex;flex-direction:column;gap:16px;margin-top:36px}
    .fcol{display:contents}
    .fillo{display:none}
    .fcard{border:1px solid var(--line);border-radius:12px;padding:24px;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
    @media(hover:hover){.fcard:hover{transform:translateY(-4px);box-shadow:0 14px 30px -18px rgba(2,6,23,.35)}}
    .fcard h3{margin-bottom:10px}
    .fcard p{color:var(--muted);font-size:16px;line-height:1.5;letter-spacing:-.02em}
    .fillo-box{position:relative;background:var(--surface);border:1px solid var(--line2);border-radius:12px;height:100%;min-height:300px;display:grid;place-items:center;overflow:hidden}
    /* features: on-device redaction preview (mirrors the live site's "on your device") — brand black, no purple */
    .fx{position:absolute;inset:0;display:flex;padding:18px}
    .fw{flex:1;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line2);border-radius:11px;overflow:hidden;box-shadow:0 6px 20px -12px rgba(2,6,23,.35)}
    .fw-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fafaf8;border-bottom:1px solid var(--line)}
    .fw-dots{display:flex;gap:4px}
    .fw-dots i{width:7px;height:7px;border-radius:50%}
    .fw-dots i:nth-child(1){background:#f0b9b0}.fw-dots i:nth-child(2){background:#f3ddae}.fw-dots i:nth-child(3){background:#bfe0d9}
    .fw-name{flex:1;font-size:9px;color:#54534e}
    .fw-pill{display:inline-flex;align-items:center;gap:3px;background:#f1efe9;color:#8a6d3b;border-radius:100px;padding:2px 8px;font-size:8px;font-weight:500}
    .fw-doc{flex:1;padding:12px;display:flex;flex-direction:column;gap:7px}
    .fw-h{font-size:9px;font-weight:500;letter-spacing:.05em;color:var(--ink)}
    .fw-doc p{font-size:8.7px;line-height:1.8;color:#475569}
    .fw-tok{border-radius:3px;padding:0 3px;animation:fwRedact 9s var(--ease) infinite;animation-delay:calc(var(--d) * .5s)}
    @keyframes fwRedact{0%,6%{background:transparent;color:inherit}9%,13%{background:#f3ddae;color:#7c2d12}17%,88%{background:var(--ink);color:var(--ink)}95%,100%{background:transparent;color:inherit}}
    .fw-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-top:1px solid var(--line);background:#fafaf8;font-size:8px;color:var(--muted);letter-spacing:.05em}
    .fw-count{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:0}
    @media(prefers-reduced-motion:reduce){.fw-tok{animation:none;background:var(--ink);color:var(--ink)}}
    @media(prefers-reduced-motion:reduce){.fx *{animation:none!important}}
    /* faq */
    .faq-wrap{display:grid;grid-template-columns:1fr;gap:24px}
    .faq-list{display:flex;flex-direction:column}
    .faq-item{border-bottom:1px solid var(--line)}

      const links=(d.nav?.links||[]).map(l=>`<a href="${esc(l.href)}">${esc(l.label)}</a>`).join('');
      const mark=d.brand?.logoMark?`<img class="mark-img" src="${esc(d.brand.logoMark)}" alt="" aria-hidden="true"/>`:`<span class="mark" aria-hidden="true">H</span>`;
      const logo=d.brand?.logo?`<img class="logo" src="${esc(d.brand.logo)}" alt="${esc(d.brand.logoAlt||d.brand.name)}"/>`:`${mark}<span>${esc(d.brand?.name)}</span>`;
      return `<header class="site" id="top"><div class="container nav">
        <a class="brand" href="#top" aria-label="${esc(d.brand?.logoAlt||d.brand?.name)}">${logo}</a>
        ${links?`<nav class="nav-links" aria-label="Primary">${links}</nav>`:''}
        <div>${btn(d.nav?.cta||'Download for Mac',dl(d),'btn-primary',IC_MAC)}</div>
      </div></header>`;
    }
    function hero(d){ const h=d.hero;
      return `<section class="hero"><div class="container"><div class="section-head center">
        ${tag(h.eyebrow,'hero-animate','style="--i:0"')}
        <h1 class="hero-animate" style="--i:1">${esc(h.headline)}</h1>
        <p class="lead subhead hero-animate" style="--i:2">${esc(h.subhead)}</p>
        <div class="hero-actions hero-animate" style="--i:3">${btn(h.primaryCta,dl(d),'btn-primary',IC_UPRIGHT,true)}</div>
        ${h.primaryCtaNote?`<span class="cta-note hero-animate" style="--i:4">${esc(h.primaryCtaNote)}</span>`:''}
        </div><div class="reveal" style="--i:1">${heroDemo()}</div></div></section>`;
    }
    function howItWorks(d){ const s=d.howItWorks; if(!s)return '';
      const caps=(s.cards||[]).map((c,i)=>`<div class="cap reveal" style="--i:${i}">
        <div class="cap-illo">${capScene(c.icon,d.brand&&d.brand.logoMark)}</div>
        <div class="cap-body"><div class="cap-title">${c.icon?`<img class="cap-ic" src="assets/icon-${esc(c.icon)}.svg" alt="" aria-hidden="true"/>`:''}<h3>${esc(c.title)}</h3></div><p>${esc(c.body)}</p></div></div>`).join('');
      return `<section id="${esc(s.id)}"><div class="container">
        <div class="hiw-head reveal">
          <div class="section-head">${tag(s.eyebrow)}<h2>${esc(s.heading)}</h2></div>
          <p class="lead hiw-body">${esc(s.body)}</p>
        </div><div class="caps">${caps}</div></div></section>`;
    }
    const CMP_ICONS=[
      _svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
      _svg('<circle cx="12" cy="12" r="3"/><path d="M12 4v3M12 17v3M4 12h3M17 12h3M6.8 6.8l2 2M15.2 15.2l2 2M17.2 6.8l-2 2M8.8 15.2l-2 2"/>'),
      _svg('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/>')
    ];
    function compare(d){ const c=d.compare; if(!c)return '';
      const logo=d.brand?.logoMark?`<img src="${esc(d.brand.logoMark)}" alt=""/>`:'';
      const rows=(c.rows||[]).map((r,i)=>`<div class="compare-row reveal" style="--i:${i}">
        <span class="c-chip">${CMP_ICONS[i%CMP_ICONS.length]}${esc(r.label)}</span>
        <div class="c-cols">
          <div class="c-with"><div class="grp-label">${logo}${esc(c.columnA)}</div><ul>${(r.hushredact||[]).map(x=>`<li>${IC_CHECK}<span>${esc(x)}</span></li>`).join('')}</ul></div>
          <div class="c-without"><div class="grp-label">${esc(c.columnB)}</div><ul>${(r.alternative||[]).map(x=>`<li>${IC_X}<span>${esc(x)}</span></li>`).join('')}</ul></div>
        </div>
      </div>`).join('');
      return `<section id="${esc(c.id)}"><div class="container">
        <div class="section-head center reveal">${tag(c.eyebrow)}<h2>${esc(c.heading)}</h2></div>
        <div class="compare">
          <div class="compare-head reveal" aria-hidden="true"><div class="col-a">${logo}${esc(c.columnA)}</div><div class="col-b">${esc(c.columnB)}</div></div>
          ${rows}
        </div></div></section>`;
    }
    function useCases(d){ const u=d.useCases; if(!u)return '';
      const cards=(u.cards||[]);
      const card=c=>`<div class="fcard reveal">${c.icon?`<div class="fcard-ic">${FEAT_ICONS[c.icon]||''}</div>`:''}<h3>${esc(c.heading)}</h3><p>${esc(c.body)}</p></div>`;
      const left=cards.slice(0,2).map(card).join(''); const right=cards.slice(2,4).map(card).join('');
      return `<section id="${esc(u.id)}"><div class="container">
        <div class="section-head center reveal">${tag(u.eyebrow)}<h2>${esc(u.heading)}</h2>${u.body?`<p class="lead">${esc(u.body)}</p>`:''}
        ${u.cta?`<div class="mt-cta">${btn(u.cta,u.ctaHref||'#how-it-works','btn-primary',IC_ARROW,true)}</div>`:''}</div>
        <div class="features-grid">
          <div class="fcol">${left}</div>
          <div class="fillo reveal"><div class="fillo-box">${featScene()}</div></div>
          <div class="fcol">${right}</div>
        </div></div></section>`;
    }
    function faq(d){ const f=d.faq; if(!f)return '';
      const items=(f.items||[]).map((it,i)=>`<div class="faq-item reveal" style="--i:${i}">
        <button class="faq-q" aria-expanded="false" id="q${i}" aria-controls="p${i}"><span>${esc(it.question)}</span>${IC_CHEV}</button>
        <div class="faq-panel" id="p${i}" role="region" aria-labelledby="q${i}"><div><p>${esc(it.answer)}</p></div></div></div>`).join('');
      return `<section id="${esc(f.id)}"><div class="container faq-wrap">
        <div class="section-head reveal">${tag(f.eyebrow)}<h2>${esc(f.heading)}</h2>${f.body?`<p class="lead">${esc(f.body)}</p>`:''}
        ${f.cta?`<div class="mt-cta">${btn(f.cta,f.ctaHref||'#','btn-primary',IC_ARROW,true)}</div>`:''}</div>
        <div class="faq-list">${items}</div></div></section>`;
    }
    function finalCta(d){ const f=d.finalCta; if(!f)return '';
      return `<section><div class="container"><div class="final reveal">
        <div class="final-img">${ctaScene(d)}</div>
        <div class="final-content"><h2>${esc(f.heading)}</h2>${f.body?`<p class="lead">${esc(f.body)}</p>`:''}
        <div class="mt-cta">${btn(f.cta,dl(d),'btn-primary',IC_MAC)}</div>${f.note?`<span class="cta-note">${esc(f.note)}</span>`:''}</div>
      </div></div></section>`;
    }
    function footer(d){ const f=d.footer; if(!f)return '';
      const cols=(f.columns||[]).map(col=>`<div class="foot-col"><h4>${esc(col.title)}</h4><ul>${(col.links||[]).map(l=>`<li><a href="${esc(l.href)}"${l.emphasis?' class="em"':''}>${esc(l.label)}${l.emphasis?IC_ARROW:''}</a></li>`).join('')}</ul></div>`).join('');
      return `<footer class="site"><div class="container">
        <div class="foot-grid">
          <div class="foot-brand"><a class="brand" href="#top">${d.brand?.logoMark?`<img class="mark-img" src="${esc(d.brand.logoMark)}" alt="" aria-hidden="true"/>`:`<span class="mark" aria-hidden="true">H</span>`}<span>${esc(d.brand?.name)}</span></a>
          <p class="foot-blurb">${esc(f.blurb)}</p>${f.cta?btn(f.cta,dl(d),'btn-primary',IC_MAC):''}</div>
          ${cols}
        </div>
        <div class="foot-bottom">${esc(f.copyright)}</div>
      </div></footer>`;
    }
    function wire(){
      document.querySelectorAll('.faq-q').forEach(b=>b.addEventListener('click',()=>{
        const it=b.closest('.faq-item'); const open=it.classList.toggle('open'); b.setAttribute('aria-expanded',open?'true':'false');
      }));
      const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
      const els=document.querySelectorAll('.reveal');
      if(reduce||!('IntersectionObserver'in window)){els.forEach(e=>e.classList.add('in-view'));}
      else{const io=new IntersectionObserver((en)=>{en.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in-view');io.unobserve(e.target)}})},{rootMargin:'0px 0px -8% 0px',threshold:.08});els.forEach(e=>io.observe(e));}
      requestAnimationFrame(()=>document.body.classList.add('loaded'));
    }
    function render(d){ setMeta(d.meta,d.brand);
      document.getElementById('app').innerHTML=[header(d),hero(d),howItWorks(d),compare(d),useCases(d),faq(d),finalCta(d),footer(d)].join('');
      wire();
    }
    fetch('landing.data.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(render)
      .catch(err=>{document.getElementById('app').innerHTML='<div class="error"><strong>Could not load landing.data.json.</strong><br>Serve over HTTP (e.g. <code>python3 -m http.server 8000</code> from the project root). ('+esc(err.message)+')</div>';});
  </script>
</body>
</html>
