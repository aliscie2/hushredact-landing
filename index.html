<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HushRedact</title>
  <meta name="description" content="" />
  <meta property="og:title" content="" />
  <meta property="og:description" content="" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{
      --ink:#020617; --ink2:#0f172a; --muted:#64748b; --line:#f1f5f9; --line2:#e2e8f0;
      --surface:#f8fafc; --accent:#6366f1; --accent-ink:#1e1b4b; --accent-soft:#eef2ff; --white:#fff;
      --ok:#15803d; --no:#b91c1c; --maxw:1200px; --ease:cubic-bezier(.22,1,.36,1);
      --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --font-head:"Geist","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    h1,h2,h3,h4,.brand,.eyebrow,.btn,.c-label,.faq-q{font-family:var(--font-head)}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{margin:0;font-family:var(--font);color:var(--ink);background:var(--white);line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-size:16px}
    .container{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 24px}
    a{color:inherit}
    img{max-width:100%;height:auto;display:block}
    section{padding:64px 0}
    /* Exact Figma type tokens — Geist Medium 500 headings, Inter Regular 400 body */
    h1,h2,h3,h4{margin:0;font-weight:500}
    h1{font-size:clamp(36px,7vw,72px);line-height:1;letter-spacing:-.06em}      /* Label/Type@72 */
    h2{font-size:clamp(26px,4.5vw,48px);line-height:1.25;letter-spacing:-.06em} /* Label/Type@48 */
    h3{font-size:18px;line-height:1.55;letter-spacing:-.02em}                   /* Label/Type@18 */
    h4{font-size:16px;line-height:1.5;letter-spacing:-.02em}                    /* Label/Type@16 */
    p{margin:0}
    .lead{font-size:clamp(16px,2.2vw,18px);line-height:1.55;letter-spacing:-.02em;color:var(--muted)} /* Paragraph/Type@18 */
    /* tag component (Figma 57927:21071) */
    .eyebrow{display:inline-flex;align-items:center;gap:4px;font-family:var(--font-head);font-size:14px;font-weight:500;letter-spacing:-0.02em;color:var(--ink);background:rgba(229,229,229,.4);backdrop-filter:blur(16.75px);border:1px solid #e5e5e5;padding:4px 8px;border-radius:100px;margin-bottom:16px;text-align:left}
    .eyebrow img{width:16px;height:16px;flex:none;display:block}
    /* features card icon box */
    .fcard-ic{width:40px;height:40px;border:1px solid var(--line);border-radius:8px;background:#fff;display:grid;place-items:center;margin-bottom:16px}
    .fcard-ic svg{width:24px;height:24px;color:var(--ink)}
    .section-head{max-width:760px}
    .section-head.center{margin:0 auto;text-align:center}
    .section-head .lead{margin-top:14px}
    .mt-cta{margin-top:32px}
    /* buttons */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-size:14px;line-height:1.55;letter-spacing:-.02em;font-weight:500;text-decoration:none;padding:12px 22px;border-radius:1000px;border:1px solid transparent;cursor:pointer;min-height:44px;white-space:nowrap;transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease)}
    .btn-primary{background:var(--ink);color:#fff;border-color:var(--ink2)}
    .btn-soft{background:var(--surface);color:var(--ink);border-color:var(--line2)}
    .btn .ic{width:16px;height:16px;flex:none}
    @media(hover:hover){.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px -8px rgba(2,6,23,.45)}}
    .cta-note{display:block;font-size:13px;color:var(--muted);margin-top:12px}
    /* header */
    header.site{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
    .nav{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;text-decoration:none;letter-spacing:-.02em}
    .brand .mark{width:28px;height:28px;border-radius:7px;background:var(--accent-ink);color:#fff;display:grid;place-items:center;font-weight:700}
    .brand .mark-img{height:30px;width:auto;display:block}
    .brand img.logo{height:28px;width:auto}
    .nav-links{display:flex;gap:24px}
    .nav-links a{color:var(--muted);text-decoration:none;font-size:15px;font-weight:500}
    @media(hover:hover){.nav-links a:hover{color:var(--ink)}}
    /* hero */
    .hero{text-align:center;padding-top:56px}
    .hero .subhead{max-width:760px;margin:20px auto 0}
    .hero-actions{margin-top:28px;display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap}
    .hero-media{margin-top:48px;border:1px solid var(--line2);border-radius:16px;overflow:hidden;background:var(--surface);aspect-ratio:16/10;display:grid;place-items:center}
    .hero-media img{width:100%;height:100%;object-fit:cover}
    .ph{color:var(--muted);font-size:13px;padding:24px;text-align:center}
    /* animated hero demo (reproduces live-site hero: scan sweep -> redact -> pills) */
    .hero-demo{margin-top:48px;border:1px solid var(--line2);border-radius:16px;background:var(--white);overflow:hidden;display:grid;grid-template-columns:1.55fr 1fr;box-shadow:0 24px 60px -34px rgba(2,6,23,.4)}
    .demo-doc{position:relative;padding:22px 24px;border-right:1px solid var(--line);overflow:hidden;text-align:left}
    .demo-doc-title{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:16px}
    .demo-doc-title::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
    .demo-line{font-size:12.5px;line-height:2.15;color:#334155}
    .tok{border-radius:4px;padding:1px 5px;white-space:nowrap;animation:demoRedact 5.6s var(--ease) infinite;animation-delay:calc(var(--d,0) * 1s)}
    @keyframes demoRedact{0%,7%{background:transparent;color:inherit}9%,14%{background:#fde68a;color:#7c2d12}19%,100%{background:var(--ink);color:var(--ink)}}
    .demo-scan{position:absolute;top:16px;bottom:16px;left:20px;width:2px;border-radius:2px;background:linear-gradient(180deg,transparent,var(--accent),transparent);box-shadow:0 0 18px 4px rgba(99,102,241,.5);animation:demoScan 5.6s var(--ease) infinite}
    @keyframes demoScan{0%{opacity:0;transform:translateX(0) scaleY(.7)}5%{opacity:1;transform:translateX(0) scaleY(1)}52%{opacity:1;transform:translateX(min(58vw,420px)) scaleY(1)}60%,100%{opacity:0;transform:translateX(min(58vw,420px))}}
    .demo-panel{padding:18px;background:var(--surface);text-align:left}
    .demo-panel-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:14px;color:var(--ink)}
    .demo-count{background:var(--white);border:1px solid var(--line2);border-radius:100px;padding:2px 9px;font-size:11px;font-variant-numeric:tabular-nums;animation:demoPulse 5.6s var(--ease) infinite}
    @keyframes demoPulse{0%,40%{transform:scale(1)}48%{transform:scale(1.12)}56%,100%{transform:scale(1)}}
    .demo-pills{display:flex;flex-direction:column;gap:9px}
    .demo-pill{display:flex;align-items:center;gap:9px;background:var(--white);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;opacity:0;animation:demoPill 5.6s var(--ease) infinite;animation-delay:calc(var(--d,0) * 1s + .3s)}
    .demo-pill .tag2{font-size:9px;font-weight:700;letter-spacing:.03em;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:2px 5px;flex:none}
    .demo-pill .bar{flex:1;height:7px;background:var(--ink);border-radius:3px;opacity:.85}
    @keyframes demoPill{0%,11%{opacity:0;transform:scale(.82) translateY(5px);filter:saturate(.4)}21%{opacity:1;transform:scale(1.06) translateY(0);filter:saturate(1)}28%,100%{opacity:1;transform:scale(1);filter:saturate(1)}}
    @media(prefers-reduced-motion:reduce){
      .tok{animation:none;background:var(--ink);color:var(--ink)}
      .demo-scan{display:none}
      .demo-pill{animation:none;opacity:1}
      .demo-count{animation:none}
    }
    @media(max-width:767px){.hero-demo{grid-template-columns:1fr}.demo-panel{border-top:1px solid var(--line)}.demo-doc{border-right:0}}
    /* how it works */
    .hiw-head{display:flex;flex-direction:column;gap:12px}
    .caps{display:grid;grid-template-columns:1fr;gap:20px;margin-top:40px}
    .cap{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--white);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
    @media(hover:hover){.cap:hover{transform:translateY(-4px);box-shadow:0 14px 30px -18px rgba(2,6,23,.35)}}
    .cap-illo{position:relative;background:var(--surface);border-bottom:1px solid var(--line);aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden}
    .cap-illo img{width:100%;height:100%;object-fit:cover}
    /* how-it-works: 3 distinct step animations */
    .sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px}
    .sc .lbl{font-size:9px;font-weight:600;background:#fff;border:1px solid var(--line2);border-radius:6px;padding:4px 9px;color:var(--muted)}
    /* 1 · detect */
    .sc-detect .chips{display:flex;gap:8px}
    .sc-detect .chip{font-size:9px;font-weight:600;background:#fff;border:1px solid var(--line2);border-radius:6px;padding:4px 8px;color:var(--muted);animation:chipHit 4.2s var(--ease) infinite;animation-delay:calc(var(--d) * .45s)}
    @keyframes chipHit{0%,9%{border-color:var(--line2);color:var(--muted);box-shadow:none}17%,27%{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 3px rgba(2,6,23,.07)}42%,100%{border-color:var(--line2);color:var(--muted);box-shadow:none}}
    .sc-detect .flow{position:relative;width:2px;height:24px;background:linear-gradient(var(--line2),var(--line2)) center/2px 100% no-repeat}
    .sc-detect .dot{position:absolute;left:-2px;width:6px;height:6px;border-radius:50%;background:var(--ink);opacity:0;animation:flowDown 4.2s var(--ease) infinite;animation-delay:calc(var(--d) * .45s + .18s)}
    @keyframes flowDown{0%,11%{opacity:0;transform:translateY(0)}21%{opacity:1;transform:translateY(1px)}52%{opacity:1;transform:translateY(20px)}60%,100%{opacity:0;transform:translateY(20px)}}
    .sc-detect .hub{width:40px;height:40px;border-radius:11px;background:#fff;border:1px solid var(--line2);display:grid;place-items:center;box-shadow:0 6px 18px -10px rgba(2,6,23,.35);animation:hubPulse 4.2s var(--ease) infinite}
    .sc-detect .hub img{width:21px;height:auto;display:block}
    @keyframes hubPulse{0%,44%{transform:scale(1);box-shadow:0 6px 18px -10px rgba(2,6,23,.35)}56%{transform:scale(1.09);box-shadow:0 6px 18px -10px rgba(2,6,23,.35),0 0 0 6px rgba(2,6,23,.06)}68%,100%{transform:scale(1);box-shadow:0 6px 18px -10px rgba(2,6,23,.35)}}
    /* 2 · private (blocked upload) */
    .sc-private{gap:0;justify-content:space-between;padding:16px}
    .sc-private .chan{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center}
    .sc-private .shield{position:absolute;top:8px;left:20%;right:20%;border-top:2px dashed var(--line2)}
    .sc-private .shield::after{content:"";position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:15px;height:15px;border-radius:4px;border:1.6px solid var(--ink);background:#fff;animation:shieldFlash 3.8s var(--ease) infinite}
    @keyframes shieldFlash{0%,40%{border-color:var(--ink);box-shadow:none}45%,53%{border-color:var(--no);box-shadow:0 0 0 4px rgba(185,28,28,.14)}61%,100%{border-color:var(--ink);box-shadow:none}}
    .sc-private .packet{position:absolute;bottom:2px;width:24px;height:17px;border-radius:4px;background:var(--ink);animation:packetBlock 3.8s var(--ease) infinite}
    @keyframes packetBlock{0%,14%{transform:translateY(0);opacity:.92}44%{transform:translateY(-30px);opacity:1}52%{transform:translateY(-26px)}66%,100%{transform:translateY(0);opacity:.92}}
    /* 3 · offline */
    .sc-offline .wifi{position:relative;display:flex;align-items:flex-end;gap:3px;height:22px}
    .sc-offline .wifi i{width:5px;border-radius:2px;background:var(--accent);animation:wifiOff 4s var(--ease) infinite}
    .sc-offline .wifi i:nth-child(1){height:7px;animation-delay:.28s}
    .sc-offline .wifi i:nth-child(2){height:13px;animation-delay:.14s}
    .sc-offline .wifi i:nth-child(3){height:19px}
    @keyframes wifiOff{0%,28%{background:var(--accent)}44%,100%{background:var(--line2)}}
    .sc-offline .wifi .slash{position:absolute;left:50%;top:-3px;width:2px;height:28px;background:var(--no);transform:translateX(-50%) rotate(45deg) scaleY(0);transform-origin:center;animation:slashIn 4s var(--ease) infinite}
    @keyframes slashIn{0%,30%{transform:translateX(-50%) rotate(45deg) scaleY(0)}46%,100%{transform:translateX(-50%) rotate(45deg) scaleY(1)}}
    .sc-offline .mini{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:60%}
    .sc-offline .mini .row{height:5px;width:100%;border-radius:3px;background:var(--line2);animation:rowRedact 4s var(--ease) infinite;animation-delay:calc(var(--d) * .28s + 1.3s)}
    .sc-offline .mini .row:nth-child(2){width:84%}
    .sc-offline .mini .row:nth-child(3){width:66%}
    @keyframes rowRedact{0%,48%{background:var(--line2)}60%,100%{background:var(--ink)}}
    @media(prefers-reduced-motion:reduce){
      .sc *{animation:none!important}
      .sc-detect .chip{border-color:var(--accent);color:var(--ink)}
      .sc-detect .dot{display:none}
      .sc-offline .wifi i{background:var(--line2)}
      .sc-offline .wifi .slash{transform:translateX(-50%) rotate(45deg) scaleY(1)}
      .sc-offline .mini .row{background:var(--ink)}
      .sc-private .packet{transform:translateY(0)}
    }
    .cap-body{padding:22px}
    .cap-title{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .cap-title h3{margin:0}
    .cap-ic{width:20px;height:20px;flex:none;color:var(--ink)}
    .cap-body p{color:var(--muted);font-size:16px;line-height:1.5;letter-spacing:-.02em}
    /* compare */
    .compare{margin-top:40px}
    .compare-head{display:none}
    .compare-rows{display:flex;flex-direction:column;gap:16px}
    .compare-row{border:1px solid var(--line2);border-radius:12px;overflow:hidden}
    .c-label{font-weight:500;font-size:18px;padding:18px 20px;background:var(--surface)}
    .c-with,.c-without{padding:18px 20px;border-top:1px solid var(--line)}
    .c-with{background:#fbfbff}
    .grp-label{font-size:13px;font-weight:500;margin-bottom:10px}
    .c-with .grp-label{color:var(--accent)}
    .c-without .grp-label{color:var(--muted)}
    .compare ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px}
    .compare li{font-size:14.5px;display:flex;gap:10px;align-items:flex-start;line-height:1.45}
    .mk{flex:none;width:18px;height:18px;margin-top:1px}
    .mk-ok{color:var(--ok)} .mk-no{color:var(--no)}
    /* features */
    .features-grid{display:flex;flex-direction:column;gap:16px;margin-top:36px}
    .fcol{display:contents}
    .fillo{display:none}
    .fcard{border:1px solid var(--line);border-radius:12px;padding:24px;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
    @media(hover:hover){.fcard:hover{transform:translateY(-4px);box-shadow:0 14px 30px -18px rgba(2,6,23,.35)}}
    .fcard h3{margin-bottom:10px}
    .fcard p{color:var(--muted);font-size:16px;line-height:1.5;letter-spacing:-.02em}
    .fillo-box{position:relative;background:var(--surface);border:1px solid var(--line2);border-radius:12px;height:100%;min-height:300px;display:grid;place-items:center;overflow:hidden}
    /* features: on-device redaction preview (mirrors the live site's "on your device") — brand black, no purple */
    .fx{position:absolute;inset:0;display:flex;padding:18px}
    .fw{flex:1;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line2);border-radius:11px;overflow:hidden;box-shadow:0 6px 20px -12px rgba(2,6,23,.35)}
    .fw-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fafaf8;border-bottom:1px solid var(--line)}
    .fw-dots{display:flex;gap:4px}
    .fw-dots i{width:7px;height:7px;border-radius:50%}
    .fw-dots i:nth-child(1){background:#f0b9b0}.fw-dots i:nth-child(2){background:#f3ddae}.fw-dots i:nth-child(3){background:#bfe0d9}
    .fw-name{flex:1;font-size:9px;color:#54534e}
    .fw-pill{display:inline-flex;align-items:center;gap:3px;background:#f1efe9;color:#8a6d3b;border-radius:100px;padding:2px 8px;font-size:8px;font-weight:500}
    .fw-doc{flex:1;padding:12px;display:flex;flex-direction:column;gap:7px}
    .fw-h{font-size:9px;font-weight:500;letter-spacing:.05em;color:var(--ink)}
    .fw-doc p{font-size:8.7px;line-height:1.8;color:#475569}
    .fw-tok{border-radius:3px;padding:0 3px;animation:fwRedact 9s var(--ease) infinite;animation-delay:calc(var(--d) * .5s)}
    @keyframes fwRedact{0%,6%{background:transparent;color:inherit}9%,13%{background:#f3ddae;color:#7c2d12}17%,88%{background:var(--ink);color:var(--ink)}95%,100%{background:transparent;color:inherit}}
    .fw-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-top:1px solid var(--line);background:#fafaf8;font-size:8px;color:var(--muted);letter-spacing:.05em}
    .fw-count{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:0}
    @media(prefers-reduced-motion:reduce){.fw-tok{animation:none;background:var(--ink);color:var(--ink)}}
    /* (legacy task-pipeline styles below are unused) */
    .fx-legacy{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:15px;padding:22px}
    .fx-file{display:flex;align-items:center;gap:7px;align-self:flex-start;font-size:10px;font-weight:600;color:var(--ink);background:#fff;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;box-shadow:0 2px 10px -5px rgba(2,6,23,.3)}
    .fx-file::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);animation:fxDot 8s var(--ease) infinite}
    @keyframes fxDot{0%,88%{opacity:1;transform:scale(1)}93%{opacity:.45;transform:scale(.8)}100%{opacity:1;transform:scale(1)}}
    .fx-card{background:#fff;border:1px solid var(--line2);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 3px 12px -7px rgba(2,6,23,.28)}
    .fx-k{display:block;font-size:8.5px;font-weight:600;color:var(--muted);margin-bottom:3px;letter-spacing:.03em}
    .fx-task{position:relative;display:block;height:16px;overflow:hidden}
    .fx-task span{position:absolute;left:0;top:0;font-size:11px;font-weight:600;color:var(--ink);white-space:nowrap;opacity:0;animation:fxTask 8s var(--ease) infinite;animation-delay:calc(var(--d) * 2s)}
    @keyframes fxTask{0%{opacity:0;transform:translateY(8px)}3%,21%{opacity:1;transform:none}24%,100%{opacity:0;transform:translateY(-8px)}}
    .fx-lines{display:flex;flex-direction:column;gap:5px}
    .fx-lines span{height:5px;border-radius:3px;background:var(--line2);animation:fxRedact 8s var(--ease) infinite;animation-delay:calc(var(--d) * .16s)}
    .fx-lines span:nth-child(2){width:88%}
    .fx-lines span:nth-child(3){width:96%}
    .fx-lines span:nth-child(4){width:78%}
    .fx-lines span:nth-child(5){width:64%}
    @keyframes fxRedact{0%,7%{background:var(--line2)}13%,88%{background:var(--ink)}95%,100%{background:var(--line2)}}
    .fx-prog{display:flex;align-items:stretch;gap:2px;height:42px;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;box-shadow:0 3px 12px -8px rgba(2,6,23,.25)}
    .fx-prog i{flex:1;border-radius:2px;background:var(--accent-soft);animation:fxBar 8s linear infinite;animation-delay:calc(var(--d) * .17s)}
    @keyframes fxBar{0%,4%{background:var(--accent-soft)}9%,86%{background:var(--accent)}94%,100%{background:var(--accent-soft)}}
    @media(prefers-reduced-motion:reduce){
      .fx *{animation:none!important}
      .fx-task span{opacity:0}
      .fx-task span:first-child{opacity:1}
      .fx-lines span{background:var(--ink)}
      .fx-prog i{background:var(--accent)}
    }
    /* faq */
    .faq-wrap{display:grid;grid-template-columns:1fr;gap:24px}
    .faq-list{display:flex;flex-direction:column}
    .faq-item{border-bottom:1px solid var(--line)}
    .faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;text-align:left;background:none;border:0;cursor:pointer;padding:20px 4px;font-family:inherit;font-size:18px;line-height:1.55;letter-spacing:-.02em;font-weight:500;color:var(--ink);min-height:44px}
    .faq-chev{flex:none;width:20px;height:20px;color:var(--muted);transition:transform .3s var(--ease)}
    .faq-q[aria-expanded="true"] .faq-chev{transform:rotate(180deg)}
    .faq-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
    .faq-panel>div{overflow:hidden}
    .faq-item.open .faq-panel{grid-template-rows:1fr}
    .faq-panel p{color:var(--muted);font-size:15px;padding:0 4px 20px}
    /* final cta */
    .final{border:1px solid var(--line2);border-radius:20px;overflow:hidden;background:var(--white);display:grid;grid-template-columns:1fr;gap:0}
    .final-img{position:relative;background:transparent;border-bottom:1px solid var(--line);aspect-ratio:16/9;display:none;place-items:center;overflow:hidden}
    /* CTA: Safe AI chat + safe copy (mirrors the live site's how-it-works flow) */
    .cw{position:absolute;inset:0;display:grid;grid-template-columns:.85fr 1.15fr;gap:12px;padding:18px}
    .cw section{background:#fff;border:1px solid var(--line2);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 5px 16px -11px rgba(2,6,23,.35)}
    .cw header{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
    .cw-brand{font-weight:500;font-size:10.5px;color:var(--ink)}
    .cw-online{display:flex;align-items:center;gap:4px;font-size:8px;font-weight:500;color:var(--muted);letter-spacing:.05em}
    .cw-online i{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:cwDot 2.4s ease-in-out infinite}
    @keyframes cwDot{0%,100%{opacity:1}50%{opacity:.3}}
    .cw-log{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:9px}
    .cw-msg{max-width:94%;padding:6px 8px;border-radius:9px;font-size:9.5px;line-height:1.45;opacity:0;animation:cwMsg 9s var(--ease) infinite}
    .cw-msg.u{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:3px;animation-delay:.5s}
    .cw-msg.a{align-self:flex-start;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-bottom-left-radius:3px;animation-delay:2.1s}
    @keyframes cwMsg{0%,4%{opacity:0;transform:translateY(8px)}10%,84%{opacity:1;transform:none}92%,100%{opacity:0;transform:translateY(-5px)}}
    .cw-composer{display:flex;align-items:center;gap:6px;padding:7px 9px;border-top:1px solid var(--line)}
    .cw-ph{flex:1;color:var(--muted);font-size:9px}
    .cw-send{width:18px;height:18px;border-radius:5px;background:#ededea;display:grid;place-items:center;font-size:9px;color:var(--ink)}
    .cw-safe{display:inline-flex;align-items:center;background:#e4f3ef;color:#0f766e;border-radius:100px;padding:2px 7px;font-size:8px;font-weight:500}
    .cw-docname{font-size:10px;font-weight:500;color:var(--ink)}
    .cw-body{display:flex;flex-direction:column;gap:7px;padding:10px}
    .cw-body p{font-size:9px;line-height:1.6;color:#475569}
    .cw-tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 4px;font-size:8px;font-weight:500;letter-spacing:.03em;animation:cwTag 9s var(--ease) infinite;animation-delay:calc(var(--d) * .42s + 2.6s)}
    @keyframes cwTag{0%,24%{background:var(--accent-soft);color:var(--accent)}30%,38%{background:#fde68a;color:#7c2d12}46%,100%{background:var(--accent-soft);color:var(--accent)}}
    .cw-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-top:1px solid var(--line);font-size:8px;color:var(--muted)}
    @media(prefers-reduced-motion:reduce){.cw *{animation:none!important}.cw-msg{opacity:1;transform:none}}
    /* CTA: the vault — nothing escapes, hours become minutes */
    .cx{position:absolute;inset:0;display:grid;place-items:center}
    .cx-ring{position:absolute;width:150px;height:150px;border-radius:50%;border:1.5px dashed var(--line2);animation:cxRing 5.5s var(--ease) infinite}
    .cx-ring.r2{width:212px;height:212px;animation-delay:.9s}
    @keyframes cxRing{0%{transform:scale(.82);opacity:0}22%{opacity:.9}70%{transform:scale(1.05);opacity:.45}100%{transform:scale(1.12);opacity:0}}
    .cx-hub{position:relative;z-index:2;width:70px;height:70px;border-radius:18px;background:#fff;border:1px solid var(--line2);display:grid;place-items:center;box-shadow:0 14px 34px -14px rgba(2,6,23,.4);animation:cxHub 5.5s var(--ease) infinite}
    .cx-hub img{width:34px;height:auto}
    @keyframes cxHub{0%,58%{transform:scale(1)}68%{transform:scale(1.06)}80%,100%{transform:scale(1)}}
    .cx-doc{position:absolute;width:46px;height:11px;border-radius:4px;background:var(--line2);animation:cxDoc 5.5s var(--ease) infinite}
    .cx-doc.d1{top:16%;left:13%;--tx:26px;--ty:22px}
    .cx-doc.d2{top:19%;right:11%;--tx:-26px;--ty:20px}
    .cx-doc.d3{bottom:20%;left:11%;--tx:26px;--ty:-20px}
    .cx-doc.d4{bottom:17%;right:13%;--tx:-26px;--ty:-22px}
    .cx-doc.d2{animation-delay:.3s}.cx-doc.d3{animation-delay:.6s}.cx-doc.d4{animation-delay:.9s}
    @keyframes cxDoc{0%,6%{transform:translate(0,0);background:var(--line2)}38%{transform:translate(var(--tx),var(--ty));background:var(--ink)}72%{transform:translate(var(--tx),var(--ty));background:var(--ink)}100%{transform:translate(0,0);background:var(--line2)}}
    .cx-time{position:absolute;bottom:11%;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line2);border-radius:100px;padding:5px 11px;font-size:10px;font-weight:500;color:var(--ink);box-shadow:0 4px 14px -8px rgba(2,6,23,.3)}
    .cx-time b{position:relative;display:inline-block;width:56px;height:13px;overflow:hidden;font-weight:500}
    .cx-time b span{position:absolute;left:0;top:0;white-space:nowrap;animation:cxTime 5.5s var(--ease) infinite}
    .cx-time b span:last-child{animation-delay:2.75s}
    @keyframes cxTime{0%{opacity:0;transform:translateY(9px)}6%,44%{opacity:1;transform:none}50%,100%{opacity:0;transform:translateY(-9px)}}
    @media(prefers-reduced-motion:reduce){
      .cx *{animation:none!important}
      .cx-ring{opacity:.5}
      .cx-doc{background:var(--ink);transform:translate(var(--tx),var(--ty))}
      .cx-time b span:last-child{opacity:0}
    }
    .final-content{padding:clamp(32px,5vw,56px);text-align:center}
    .final-content .lead{max-width:520px;margin:14px auto 0}
    /* footer */
    footer.site{border-top:1px solid var(--line);padding:56px 0 40px;background:var(--surface)}
    .foot-grid{display:grid;grid-template-columns:1fr;gap:32px}
    .foot-brand .brand{margin-bottom:12px}
    .foot-blurb{color:var(--muted);font-size:14px;max-width:340px;margin-bottom:16px}
    .foot-col h4{font-size:14px;margin:0 0 14px}
    .foot-col ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
    .foot-col a{color:var(--muted);text-decoration:none;font-size:14px;display:inline-flex;min-height:24px;align-items:center}
    @media(hover:hover){.foot-col a:hover{color:var(--ink)}}
    .foot-bottom{margin-top:40px;padding-top:24px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
    /* reveal animations */
    .reveal{opacity:0;transform:translateY(20px);transition:opacity .5s var(--ease),transform .5s var(--ease);transition-delay:calc(var(--i,0)*80ms)}
    .reveal.in-view{opacity:1;transform:none}
    .hero-animate{opacity:0}
    body.loaded .hero-animate{opacity:1;animation:heroIn .6s var(--ease) both;animation-delay:calc(var(--i,0)*90ms)}
    @keyframes heroIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
    @media(prefers-reduced-motion:reduce){
      html{scroll-behavior:auto}
      .reveal{opacity:1!important;transform:none!important;transition:none!important}
      .hero-animate{opacity:1!important;animation:none!important}
      .btn,.cap,.fcard{transition:none!important}
      .faq-panel,.faq-chev{transition:none}
    }
    /* ===== Tablet (768–1023): interpolate toward desktop, 2-up grids ===== */
    @media(min-width:768px){
      section{padding:80px 0}
      .caps{grid-template-columns:repeat(3,1fr)}
      .hiw-head{flex-direction:row;gap:40px;align-items:flex-start}
      .hiw-head .section-head{flex:1}
      .hiw-head .hiw-body{flex:1;padding-top:8px}
      .features-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
      .fcol{display:contents}
      .final{grid-template-columns:1fr 1fr;align-items:center}
      .final-img{display:grid;border-bottom:0;border-right:0;height:auto;aspect-ratio:auto;padding:24px;min-width:0;min-height:340px;background:transparent}
      .final-img img{max-width:100%;height:auto}
      .final-content{text-align:left;min-width:0}
      .final-content .lead{margin-left:0}
      .foot-grid{grid-template-columns:2fr 1fr 1fr}
    }
    /* ===== Desktop (≥1024): match desktop frame ===== */
    @media(min-width:1024px){
      section{padding:96px 0}
      .hero{padding-top:72px}
      /* comparison becomes a table */
      .compare-head{display:grid;grid-template-columns:1.1fr 1fr 1fr;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;overflow:hidden;background:var(--surface)}
      .compare-head>div{padding:16px 20px;font-weight:500;font-size:14px;border-left:1px solid var(--line)}
      .compare-head>div:first-child{border-left:0}
      .compare-head .col-a{background:#fbfbff;color:var(--ink);display:flex;align-items:center;gap:8px}
      .compare-head .col-a img{width:22px;height:22px;flex:none}
      .compare-rows{border:1px solid var(--line);border-radius:0 0 12px 12px;overflow:hidden;gap:0}
      .compare-row{display:grid;grid-template-columns:1.1fr 1fr 1fr;border:0;border-top:1px solid var(--line);border-radius:0}
      .compare-row:first-child{border-top:0}
      .c-label{background:var(--surface);display:flex;align-items:center}
      .c-with,.c-without{border-top:0;border-left:1px solid var(--line)}
      .grp-label{display:none}
      /* features 3-col with center illustration */
      .features-grid{grid-template-columns:1fr 1fr 1fr;align-items:stretch}
      .fcol{display:flex;flex-direction:column;gap:20px}
      .fillo{display:block}
      /* faq 2-col */
      .faq-wrap{grid-template-columns:.9fr 1.15fr;gap:48px;align-items:start}
    }
    /* ===== Mobile nav: keep the download button on one line ===== */
    @media(max-width:767px){
      .nav .btn-primary{padding:10px 14px;font-size:14px}
      .brand{font-size:18px}
    }
    /* ===== Very small screens (≤374px): keep the nav from overflowing ===== */
    @media(max-width:374px){
      .container{padding:0 16px}
      .brand{font-size:17px}
      .nav{gap:8px}
      .nav .btn-primary{padding:10px 14px;font-size:14px}
    }
    .error{max-width:640px;margin:80px auto;padding:24px;border:1px solid var(--line2);border-radius:12px;color:var(--muted)}
  </style>
</head>

  <script>
    const IC_MAC='<svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.53 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>';

        <div class="wifi"><i></i><i></i><i></i><span class="slash"></span></div>
        <span class="lbl">Offline</span>
        <div class="mini">${[0,1,2].map(i=>`<span class="row" style="--d:${i}"></span>`).join('')}</div></div>`;
      return '';
    }
    function header(d){
      const links=(d.nav?.links||[]).map(l=>`<a href="${esc(l.href)}">${esc(l.label)}</a>`).join('');
      const mark=d.brand?.logoMark?`<img class="mark-img" src="${esc(d.brand.logoMark)}" alt="" aria-hidden="true"/>`:`<span class="mark" aria-hidden="true">H</span>`;
      const logo=d.brand?.logo?`<img class="logo" src="${esc(d.brand.logo)}" alt="${esc(d.brand.logoAlt||d.brand.name)}"/>`:`${mark}<span>${esc(d.brand?.name)}</span>`;
      return `<header class="site" id="top"><div class="container nav">
        <a class="brand" href="#top" aria-label="${esc(d.brand?.logoAlt||d.brand?.name)}">${logo}</a>
        ${links?`<nav class="nav-links" aria-label="Primary">${links}</nav>`:''}
        <div>${btn(d.nav?.cta||'Download for Mac',dl(d),'btn-primary',IC_MAC)}</div>
      </div></header>`;
    }
    function hero(d){ const h=d.hero;
      return `<section class="hero"><div class="container"><div class="section-head center">
        ${tag(h.eyebrow,'hero-animate','style="--i:0"')}
        <h1 class="hero-animate" style="--i:1">${esc(h.headline)}</h1>
        <p class="lead subhead hero-animate" style="--i:2">${esc(h.subhead)}</p>
        <div class="hero-actions hero-animate" style="--i:3">${btn(h.primaryCta,dl(d),'btn-primary',IC_UPRIGHT,true)}</div>
        ${h.primaryCtaNote?`<span class="cta-note hero-animate" style="--i:4">${esc(h.primaryCtaNote)}</span>`:''}
        </div><div class="reveal" style="--i:1">${heroDemo()}</div></div></section>`;
    }
    function howItWorks(d){ const s=d.howItWorks; if(!s)return '';
      const caps=(s.cards||[]).map((c,i)=>`<div class="cap reveal" style="--i:${i}">
        <div class="cap-illo">${capScene(c.icon,d.brand&&d.brand.logoMark)}</div>
        <div class="cap-body"><div class="cap-title">${c.icon?`<img class="cap-ic" src="assets/icon-${esc(c.icon)}.svg" alt="" aria-hidden="true"/>`:''}<h3>${esc(c.title)}</h3></div><p>${esc(c.body)}</p></div></div>`).join('');
      return `<section id="${esc(s.id)}"><div class="container">
        <div class="hiw-head reveal">
          <div class="section-head">${tag(s.eyebrow)}<h2>${esc(s.heading)}</h2></div>
          <p class="lead hiw-body">${esc(s.body)}</p>
        </div><div class="caps">${caps}</div></div></section>`;
    }
    function compare(d){ const c=d.compare; if(!c)return '';
      const rows=(c.rows||[]).map((r,i)=>`<div class="compare-row reveal" style="--i:${i}">
        <div class="c-label">${esc(r.label)}</div>
        <div class="c-with"><div class="grp-label">${esc(c.columnA)}</div><ul>${(r.hushredact||[]).map(x=>`<li>${IC_CHECK}<span>${esc(x)}</span></li>`).join('')}</ul></div>
        <div class="c-without"><div class="grp-label">${esc(c.columnB)}</div><ul>${(r.alternative||[]).map(x=>`<li>${IC_X}<span>${esc(x)}</span></li>`).join('')}</ul></div>
      </div>`).join('');
      return `<section id="${esc(c.id)}"><div class="container">
        <div class="section-head center reveal">${tag(c.eyebrow)}<h2>${esc(c.heading)}</h2></div>
        <div class="compare">
          <div class="compare-head reveal" aria-hidden="true"><div></div><div class="col-a">${d.brand?.logoMark?`<img src="${esc(d.brand.logoMark)}" alt=""/>`:''}${esc(c.columnA)}</div><div class="col-b">${esc(c.columnB)}</div></div>
          <div class="compare-rows">${rows}</div>
        </div></div></section>`;
    }
    function useCases(d){ const u=d.useCases; if(!u)return '';
      const cards=(u.cards||[]);
      const card=c=>`<div class="fcard reveal">${c.icon?`<div class="fcard-ic">${FEAT_ICONS[c.icon]||''}</div>`:''}<h3>${esc(c.heading)}</h3><p>${esc(c.body)}</p></div>`;
      const left=cards.slice(0,2).map(card).join(''); const right=cards.slice(2,4).map(card).join('');
      return `<section id="${esc(u.id)}"><div class="container">
        <div class="section-head center reveal">${tag(u.eyebrow)}<h2>${esc(u.heading)}</h2>${u.body?`<p class="lead">${esc(u.body)}</p>`:''}
        ${u.cta?`<div class="mt-cta">${btn(u.cta,u.ctaHref||'#how-it-works','btn-primary',IC_ARROW,true)}</div>`:''}</div>
        <div class="features-grid">
          <div class="fcol">${left}</div>
          <div class="fillo reveal"><div class="fillo-box">${featScene()}</div></div>
          <div class="fcol">${right}</div>
        </div></div></section>`;
    }
    function faq(d){ const f=d.faq; if(!f)return '';
      const items=(f.items||[]).map((it,i)=>`<div class="faq-item reveal" style="--i:${i}">
        <button class="faq-q" aria-expanded="false" id="q${i}" aria-controls="p${i}"><span>${esc(it.question)}</span>${IC_CHEV}</button>
        <div class="faq-panel" id="p${i}" role="region" aria-labelledby="q${i}"><div><p>${esc(it.answer)}</p></div></div></div>`).join('');
      return `<section id="${esc(f.id)}"><div class="container faq-wrap">
        <div class="section-head reveal">${tag(f.eyebrow)}<h2>${esc(f.heading)}</h2>${f.body?`<p class="lead">${esc(f.body)}</p>`:''}
        ${f.cta?`<div class="mt-cta">${btn(f.cta,f.ctaHref||'#','btn-primary',IC_ARROW,true)}</div>`:''}</div>
        <div class="faq-list">${items}</div></div></section>`;
    }
    function finalCta(d){ const f=d.finalCta; if(!f)return '';
      return `<section><div class="container"><div class="final reveal">
        <div class="final-img">${ctaScene(d)}</div>
        <div class="final-content"><h2>${esc(f.heading)}</h2>${f.body?`<p class="lead">${esc(f.body)}</p>`:''}
        <div class="mt-cta">${btn(f.cta,dl(d),'btn-primary',IC_MAC)}</div>${f.note?`<span class="cta-note">${esc(f.note)}</span>`:''}</div>
      </div></div></section>`;
    }
    function footer(d){ const f=d.footer; if(!f)return '';
      const cols=(f.columns||[]).map(col=>`<div class="foot-col"><h4>${esc(col.title)}</h4><ul>${(col.links||[]).map(l=>`<li><a href="${esc(l.href)}">${esc(l.label)}</a></li>`).join('')}</ul></div>`).join('');
      return `<footer class="site"><div class="container">
        <div class="foot-grid">
          <div class="foot-brand"><a class="brand" href="#top">${d.brand?.logoMark?`<img class="mark-img" src="${esc(d.brand.logoMark)}" alt="" aria-hidden="true"/>`:`<span class="mark" aria-hidden="true">H</span>`}<span>${esc(d.brand?.name)}</span></a>
          <p class="foot-blurb">${esc(f.blurb)}</p>${f.cta?btn(f.cta,dl(d),'btn-primary',IC_MAC):''}</div>
          ${cols}
        </div>
        <div class="foot-bottom">${esc(f.copyright)}</div>
      </div></footer>`;
    }
    function wire(){
      document.querySelectorAll('.faq-q').forEach(b=>b.addEventListener('click',()=>{
        const it=b.closest('.faq-item'); const open=it.classList.toggle('open'); b.setAttribute('aria-expanded',open?'true':'false');
      }));
      const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
      const els=document.querySelectorAll('.reveal');
      if(reduce||!('IntersectionObserver'in window)){els.forEach(e=>e.classList.add('in-view'));}
      else{const io=new IntersectionObserver((en)=>{en.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in-view');io.unobserve(e.target)}})},{rootMargin:'0px 0px -8% 0px',threshold:.08});els.forEach(e=>io.observe(e));}
      requestAnimationFrame(()=>document.body.classList.add('loaded'));
    }
    function render(d){ setMeta(d.meta,d.brand);
      document.getElementById('app').innerHTML=[header(d),hero(d),howItWorks(d),compare(d),useCases(d),faq(d),finalCta(d),footer(d)].join('');
      wire();
    }
    fetch('../landing.data.json').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(render)
      .catch(err=>{document.getElementById('app').innerHTML='<div class="error"><strong>Could not load landing.data.json.</strong><br>Serve over HTTP (e.g. <code>python3 -m http.server 8000</code> from the project root). ('+esc(err.message)+')</div>';});
  </script>
</body>
</html>
